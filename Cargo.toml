[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "CC0-1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Keep local builds small; completed checks discard incremental state.
[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
