# Allowed differences between Python and Rust output, by rule ID. Scenarios
# name the rule they use. Any difference not covered here is a failure.

[[rule]]
id = "transport-node-status"
python_select = "pve"
python_rename = { version = "pveversion", kernel = "kversion" }
reason = """
Phase 0 dry run. Python's `transport --json` reports the node status under
`pve` with renamed keys, next to a `transport` block describing the Herdr
session. The server reads the same `/nodes/{node}/status` and returns
Proxmox's own key names; the Herdr session has no server counterpart
(mapping T1, A4).
"""

[[rule]]
id = "same"
reason = "No difference: the server returns what the Python function returns."

[[rule]]
id = "status-global"
python_drop = ["ok", "command", "scope", "config", "execution", "summary.storage_unit", "summary.storage_decimals"]
python_ops_drop = ["guest_exec{*", "guest_exec_status{*"]
rust_ops_drop = ["get{path=/nodes/*/qemu/*/agent/*", "get{path=/access/permissions,*"]
reason = """
`ok`, `command` and `scope` describe the CLI result, `config` and
`execution` the desktop's config file and Herdr session; the HTTP status and
the route say the same on the server. Storage display settings belong to
`client.toml` (phase 1). Home usage: Python runs `findmnt | blkid` and `df`
through `exec`; the server reads `get-fsinfo` (mapping D3, VM.GuestAgent.Audit
only), which gives the same numbers (phase-2.md). Guest pings are compared.
The server also asks `/access/permissions` whether its token may list VM
volumes at all (Python runs as root); a gap shows as an incomplete orphan
scan instead of an empty one.
"""

[[rule]]
id = "status-workspace"
python_drop = ["ok", "command", "config", "execution", "mounted_home_label", "ubuntu_user_present"]
python_ops_drop = ["guest_exec{*", "guest_exec_status{*"]
rust_ops_drop = ["get{path=/nodes/*/qemu/*/agent/*"]
reason = """
As status-global. The guest is read with `get-host-name`,
`network-get-interfaces` and `get-fsinfo` instead of `exec` (mapping A2).
`get-fsinfo` has no filesystem label: the server proves the home mount by the
QEMU drive of the home slot instead, so `mounted_home_label` is gone and
`home_mount_ok` keeps its meaning. Whether an `ubuntu` account exists needs
`exec` (VM.GuestAgent.Unrestricted) and moves to the Gold guest checks
(phase 3, mapping E2).
"""

[[rule]]
id = "storage-from-status"
python_select = "summary.storage_layouts"
python_ops_drop = ["*"]
rust_ops_drop = ["*"]
reason = """
Python has no command for storage capacity alone (mapping A7); it is part of
`status --json`. The server's GET /v1/storage returns the same list. The
operations are not comparable: Python's are the whole global status.
"""

[[rule]]
id = "orphans-from-status"
python_pick = { volumes = "summary.orphaned_volumes", complete = "summary.orphan_scan_complete" }
rust_drop = ["warnings"]
python_ops_drop = ["*"]
rust_ops_drop = ["*"]
reason = """
Python has no command for detached volumes alone (mapping A8); they are part
of `status --json`, whose warnings mix every check. The server's GET
/v1/orphans returns the volumes, whether the scan was complete and its own
warnings. The operations are not comparable: Python's are the whole global
status.
"""

[[rule]]
id = "status-global-live"
extends = "status-global"
relative_tolerance = { "workspaces.*.home.used_bytes" = 0.05, "workspaces.*.home.free_bytes" = 0.05, "summary.homes.used_bytes" = 0.05, "summary.homes.free_bytes" = 0.05, "summary.storage_layouts.*.used_bytes" = 0.05, "summary.storage_layouts.*.available_bytes" = 0.05, "summary.root_storage.used_bytes" = 0.05, "summary.root_storage.available_bytes" = 0.05 }
absolute_tolerance = { "workspaces.*.home.free_percent" = 1.0, "summary.homes.free_percent" = 1.0, "summary.storage_layouts.*.percent" = 1.0, "summary.root_storage.percent" = 1.0 }
reason = """
scripts/live-compare-status.sh on the real cluster. As status-global, plus:
the two implementations read a running cluster a few seconds apart, so
guests and storages may have written a little in between (byte counts within
5 %, percentages within 1 point). Since the production install (phase 5,
decision 10 = C) the server's token has VM.Config.Disk only on pool
homestack: it cannot list the volumes of other or deleted VMs, so its scan
says it is incomplete, with one warning per storage. Those warnings and
`orphan_scan_complete` are not compared; the volumes found still are.
"""
python_drop = ["summary.orphan_scan_complete"]
rust_drop = ["summary.orphan_scan_complete"]
rust_drop_items = { warnings = "HomeStack orphan scan incomplete: The server's Proxmox token cannot list the volumes of VMs outside pool *" }

[[rule]]
id = "guest-verify"
python_ops_drop = ["guest_exec{*", "guest_exec_status{*"]
rust_ops_drop = ["get{*path=/nodes/*/qemu/*/agent/*"]
reason = """
Decision 5: the server verifies a guest with the audit-level agent commands
(`get-host-name`, `network-get-interfaces`, `get-fsinfo`) and `file-read`
(`/etc/passwd`, the authorized_keys files, the ext4 superblock of the home
device, `/run/cloud-init/*`, the `sudo` binary) instead of shell commands
through `exec`. The pings, the reads of the VM and the outcome are compared.
"""

[[rule]]
id = "workspace-keys"
python_ops_drop = ["guest_exec{*", "guest_exec_status{*"]
rust_ops_drop = ["get{*path=/nodes/*/qemu/*/agent/file-read*"]
reason = """
Phase 4, mapping C5: Python reads Gold's authorized_keys files with
`test -s F && cat F` through `exec`; the server reads them with `file-read`
(decision 5, VM.GuestAgent.FileRead). The reads of the cluster and of Gold's
config and status, the ping and the outcome are compared.
"""

[[rule]]
id = "gold-readiness"
python_ops_drop = ["guest_exec_status{*"]
rust_ops_drop = ["guest_exec_status{*", "guest_exec{cmd=for c in netplan udevadm NetworkManager python3;*", "guest_exec{cmd=python3 -c 'import yaml'*"]
rust_drop_items = { checks = "name=Cloud-Init vendor snippet tools" }
reason = """
Phase 4b: after Python's guest contract the server also checks what the
vendor snippet needs in Gold (decision 1 = A): `netplan`, `udevadm`,
`NetworkManager` and `python3` with `yaml`. That check and its two commands
are the server's own; the rest, `ok` included, is compared. The
`exec-status` polls only pair each command with its result, and differ in
number by the two extra commands.
"""

[[rule]]
id = "cli-status-global"
python_drop = ["config", "execution"]
rust_drop = ["config", "execution"]
python_ops_drop = ["guest_exec{*", "guest_exec_status{*"]
rust_ops_drop = ["get{path=/nodes/*/qemu/*/agent/*", "get{path=/access/permissions,*"]
reason = """
Phase 13: `homestack status --json` of the Rust client against the server,
compared with the Python CLI as a whole, `ok`, `command`, `scope` and the
display settings of `[display]` included. `config` is the client's file
(`client.toml` instead of `config.toml`) and `execution` names the server
instance that answered instead of the Herdr session. The operations differ
as in status-global.
"""

[[rule]]
id = "cli-status-workspace"
python_drop = ["config", "execution", "mounted_home_label", "ubuntu_user_present"]
rust_drop = ["config", "execution"]
python_ops_drop = ["guest_exec{*", "guest_exec_status{*"]
rust_ops_drop = ["get{path=/nodes/*/qemu/*/agent/*"]
reason = """
Phase 13: `homestack status VMID --json` of the Rust client, with `ok` and
`command` compared; `config` and `execution` as cli-status-global, the guest
fields as status-workspace.
"""
