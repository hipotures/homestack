name: Publish signed APT repository

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      APT_SIGNING_KEY:
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homestack-apt-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev gnupg
      - name: Build and sign the archive
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: python3 deploy/apt/publish.py
      - name: Verify the published index signature
        run: gpgv --keyring "$PWD/deploy/apt/homestack-archive-keyring.gpg" target/apt-site/apt/dists/stable/InRelease
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/apt-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed archive
        id: deployment
        uses: actions/deploy-pages@v4
