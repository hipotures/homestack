name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit and headless TUI tests
        run: uv run python -m unittest discover -s tests -v
      - name: Check commit whitespace
        run: git show --format= --check HEAD
