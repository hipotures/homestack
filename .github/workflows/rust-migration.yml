name: Rust checks

on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: L1-L3 checks
        run: scripts/check.sh
      - name: Check commit whitespace
        run: git show --format= --check HEAD

  # Publish immutable API releases, e.g. homestack-server:0.2.0.
  image:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Image tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install Rust 1.99.0 for musl
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: musl-server
      - name: Build the server
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          python3 scripts/cargo.py build --release --locked --target x86_64-unknown-linux-musl -p hs-server --bin homestack-server
          ! readelf -l target/x86_64-unknown-linux-musl/release/homestack-server | grep -q INTERP
          mkdir -p image
          cp target/x86_64-unknown-linux-musl/release/homestack-server image/
          cp deploy/lxc/Caddyfile image/
          cp -r deploy/lxc/service image/service
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: image
          file: deploy/image/Containerfile
          push: true
          tags: ghcr.io/hipotures/homestack-server:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/hipotures/homestack
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
