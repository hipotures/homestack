name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: L1-L3 checks
        run: scripts/check.sh
      - name: Check commit whitespace
        run: git show --format= --check HEAD

  # The node image for homestack-deploy:
  # ghcr.io/hipotures/homestack-server:<major>.<minor>.<patch>-<commit>, public, on every
  # push to rust-migration (deploy/image/Containerfile).
  # The patch is the number of commits since `version` last changed in
  # Cargo.toml (crates/hs-cli/build.rs counts the same).
  image:
    # Built at once, beside the checks: a deployment names the commit's
    # image, and the checks still say whether the commit is good.
    if: github.event_name == 'push' && github.ref == 'refs/heads/rust-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Image tag
        id: tag
        run: |
          version=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"$/\1/p' Cargo.toml | head -1)
          since=$(git log -1 --format=%H -G '^version = ' -- Cargo.toml)
          patch=$(git rev-list --count "$since..HEAD")
          echo "tag=${version}.${patch}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Install Rust 1.99.0 for musl
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: musl-server
      - name: Build the server
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          python3 scripts/cargo.py build --release --locked --target x86_64-unknown-linux-musl -p hs-server --bin homestack-server
          ! readelf -l target/x86_64-unknown-linux-musl/release/homestack-server | grep -q INTERP
          mkdir -p image
          cp target/x86_64-unknown-linux-musl/release/homestack-server image/
          cp deploy/lxc/Caddyfile image/
          cp -r deploy/lxc/service image/service
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: image
          file: deploy/image/Containerfile
          push: true
          tags: ghcr.io/hipotures/homestack-server:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/hipotures/homestack
