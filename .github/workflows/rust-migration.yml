name: Rust migration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked Python dependencies
        working-directory: python
        run: uv sync --locked
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: L1-L3 checks
        run: scripts/check.sh

  # The node image (Containerfile, target node) for homestack-deploy:
  # ghcr.io/hipotures/homestack-server:<version>-<commit>, public, once the
  # checks pass on a push to rust-migration.
  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/rust-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image tag
        id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=${version}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Containerfile
          target: node
          push: true
          tags: ghcr.io/hipotures/homestack-server:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/hipotures/homestack
