name: Checks and API release

on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'pangolin-site-[0-9]+.[0-9]+.[0-9]+-[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Development checks
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        run: scripts/check.sh
      - name: Full verification for releases or explicit QA
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: scripts/check.sh --full
      - name: Check commit whitespace
        run: git show --format= --check HEAD

  # Publish immutable API releases, e.g. homestack-server:0.2.0.
  image:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag' && !startsWith(github.ref_name, 'pangolin-site-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Image tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install Rust 1.99.0 for musl
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: musl-server
      - name: Build the server
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          python3 scripts/cargo.py build --release --locked --target x86_64-unknown-linux-musl -p hs-server --bin homestack-server
          ! readelf -l target/x86_64-unknown-linux-musl/release/homestack-server | grep -q INTERP
          mkdir -p image
          cp target/x86_64-unknown-linux-musl/release/homestack-server image/
          cp deploy/lxc/Caddyfile image/
          cp -r deploy/lxc/service image/service
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: image
          file: deploy/image/Containerfile
          push: true
          tags: ghcr.io/hipotures/homestack-server:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/hipotures/homestack
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Publish immutable Pangolin Site connector releases, e.g.
  # homestack-pangolin-site:0.18.1-1 from tag pangolin-site-0.18.1-1. A separate
  # tag prefix keeps them from ever replacing an API release.
  site-image:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'pangolin-site-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # pangolin-site-<Pangolin CLI version>-<build>, e.g. pangolin-site-0.18.1-1;
          # the version must be the one the Containerfile pins.
          [[ "$RELEASE_TAG" =~ ^pangolin-site-(((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))-[1-9][0-9]*)$ ]]
          tag="${BASH_REMATCH[1]}"
          cli="${BASH_REMATCH[2]}"
          grep -qx "ARG PANGOLIN_CLI_VERSION=$cli" deploy/pangolin-site/Containerfile
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: deploy/pangolin-site
          file: deploy/pangolin-site/Containerfile
          push: true
          tags: ghcr.io/hipotures/homestack-pangolin-site:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/hipotures/homestack
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
