name: Checks and API release

on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'pangolin-[0-9]+.[0-9]+.[0-9]+', 'otel-[0-9]+.[0-9]+.[0-9]+', 'ai-usage-[0-9]+.[0-9]+.[0-9]+', 'pve-agent-[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Development checks
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        run: scripts/check.sh
      - name: Full verification for releases or explicit QA
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: scripts/check.sh --full
      - name: Check commit whitespace
        run: git show --format= --check HEAD

  # Publish immutable API releases, e.g. homestack-server:0.2.0.
  image:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag' && !startsWith(github.ref_name, 'pangolin-') && !startsWith(github.ref_name, 'otel-') && !startsWith(github.ref_name, 'ai-usage-') && !startsWith(github.ref_name, 'pve-agent-')
    concurrency:
      group: image-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Image tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Admit immutable image publication
        id: publication
        env:
          IMAGE: ghcr.io/hipotures/homestack-server:${{ steps.tag.outputs.tag }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: scripts/image-admission.sh "$IMAGE" "$REVISION" "$VERSION" "$EVENT"
      - name: Install Rust 1.99.0 for musl
        if: steps.publication.outputs.publish == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
        if: steps.publication.outputs.publish == 'true'
        with:
          key: musl-server
      - name: Build the server
        if: steps.publication.outputs.publish == 'true'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          python3 scripts/cargo.py build --release --locked --target x86_64-unknown-linux-musl -p hs-server --bin homestack-server
          ! readelf -l target/x86_64-unknown-linux-musl/release/homestack-server | grep -q INTERP
          mkdir -p image
          cp target/x86_64-unknown-linux-musl/release/homestack-server image/
          cp deploy/lxc/Caddyfile image/
          cp -r deploy/lxc/service image/service
      - uses: docker/build-push-action@v6.18.0
        if: steps.publication.outputs.publish == 'true'
        with:
          # PVE pulls one deployable amd64 manifest, without an attestation index.
          platforms: linux/amd64
          provenance: false
          context: image
          file: deploy/image/Containerfile
          push: true
          tags: ghcr.io/hipotures/homestack-server:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=homestack-server
            org.opencontainers.image.source=https://github.com/hipotures/homestack
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Publish immutable Pangolin Site connector releases, e.g.
  # homestack-pangolin-site:X.Y.Z from tag pangolin-X.Y.Z. A separate
  # tag prefix keeps them from ever replacing an API release.
  site-image:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'pangolin-'))
    concurrency:
      group: site-image-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo "tag=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^pangolin-((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]
          tag="${BASH_REMATCH[1]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Admit immutable image publication
        id: publication
        env:
          IMAGE: ghcr.io/hipotures/homestack-pangolin-site:${{ steps.tag.outputs.tag }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: scripts/image-admission.sh "$IMAGE" "$REVISION" "$VERSION" "$EVENT"
      - uses: docker/build-push-action@v6.18.0
        if: steps.publication.outputs.publish == 'true'
        with:
          platforms: linux/amd64
          provenance: false
          context: deploy/pangolin-site
          file: deploy/pangolin-site/Containerfile
          push: true
          tags: ghcr.io/hipotures/homestack-pangolin-site:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=homestack-pangolin-site
            org.opencontainers.image.source=https://github.com/hipotures/homestack
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  otel-image:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'otel-'))
    concurrency:
      group: otel-image-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo "tag=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^otel-((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]
          echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Admit immutable image publication
        id: publication
        env:
          IMAGE: ghcr.io/hipotures/homestack-otel:${{ steps.tag.outputs.tag }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: scripts/image-admission.sh "$IMAGE" "$REVISION" "$VERSION" "$EVENT"
      - uses: docker/build-push-action@v6.18.0
        if: steps.publication.outputs.publish == 'true'
        with:
          platforms: linux/amd64
          provenance: false
          context: deploy/otel
          file: deploy/otel/Containerfile
          load: true
          tags: ghcr.io/hipotures/homestack-otel:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=homestack-otel
            org.opencontainers.image.source=https://github.com/hipotures/homestack
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Validate the built image before publication
        if: steps.publication.outputs.publish == 'true'
        env:
          IMAGE: ghcr.io/hipotures/homestack-otel:${{ steps.tag.outputs.tag }}
        run: python3 deploy/otel/verify-image.py "$IMAGE"
      - name: Publish the validated image
        if: steps.publication.outputs.publish == 'true'
        env:
          IMAGE: ghcr.io/hipotures/homestack-otel:${{ steps.tag.outputs.tag }}
        run: docker push "$IMAGE"

  # Publish homestack-ai-usage:X.Y.Z from tag ai-usage-X.Y.Z.
  usage-image:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'ai-usage-'))
    concurrency:
      group: usage-image-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo "tag=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^ai-usage-((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]
          echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Admit immutable image publication
        id: publication
        env:
          IMAGE: ghcr.io/hipotures/homestack-ai-usage:${{ steps.tag.outputs.tag }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: scripts/image-admission.sh "$IMAGE" "$REVISION" "$VERSION" "$EVENT"
      - name: Install Rust 1.99.0 for musl
        if: steps.publication.outputs.publish == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
        if: steps.publication.outputs.publish == 'true'
        with:
          key: musl-usage
      - name: Build the server
        if: steps.publication.outputs.publish == 'true'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          HOMESTACK_USAGE_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/cargo.py build --release --locked --target x86_64-unknown-linux-musl -p hs-usage --bin homestack-usage
          ! readelf -l target/x86_64-unknown-linux-musl/release/homestack-usage | grep -q INTERP
          mkdir -p image
          cp target/x86_64-unknown-linux-musl/release/homestack-usage image/
      - uses: docker/build-push-action@v6.18.0
        if: steps.publication.outputs.publish == 'true'
        with:
          platforms: linux/amd64
          provenance: false
          context: image
          file: deploy/ai-usage/Containerfile
          load: true
          tags: ghcr.io/hipotures/homestack-ai-usage:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=homestack-ai-usage
            org.opencontainers.image.source=https://github.com/hipotures/homestack
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Validate the built image before publication
        if: steps.publication.outputs.publish == 'true'
        env:
          IMAGE: ghcr.io/hipotures/homestack-ai-usage:${{ steps.tag.outputs.tag }}
        run: |
          docker run -d --name usage --memory=64m --memory-swap=64m -p 127.0.0.1:8080:80 \
            -e HOMESTACK_PROMETHEUS_URL=http://127.0.0.1:9 -e HOMESTACK_HEARTBEAT_SECONDS=1 "$IMAGE"
          sleep 3
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/api/v1/query?query=up')" = 502
          docker stats --no-stream usage
          docker image inspect --format '{{.Size}}' "$IMAGE"
      - name: Publish the validated image
        if: steps.publication.outputs.publish == 'true'
        env:
          IMAGE: ghcr.io/hipotures/homestack-ai-usage:${{ steps.tag.outputs.tag }}
        run: docker push "$IMAGE"

  pve-agent-package:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'pve-agent-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^pve-agent-((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev binutils
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: musl-pve-agent
      - name: Build the static application
        run: deploy/pve-agent/build-static.sh
      - name: Build the Debian package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python3 deploy/pve-agent/build-deb.py --version "$PACKAGE_VERSION" \
            --binary target/x86_64-unknown-linux-musl/release/homestack-pve-agent --output target/debian
          dpkg-deb --info "target/debian/homestack-pve-agent_${PACKAGE_VERSION}_amd64.deb"
      - name: Publish the immutable package release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > /tmp/pve-agent-release-notes.md <<'EOF'
          Standalone amd64 PVE node agent. Install and update through the signed HomeStack APT repository.

          Instructions: https://github.com/hipotures/homestack/blob/main/deploy/apt/README.md
          EOF
          gh release create "$RELEASE_TAG" "target/debian/homestack-pve-agent_${PACKAGE_VERSION}_amd64.deb" \
            --verify-tag --draft --title "PVE agent $PACKAGE_VERSION" --notes-file /tmp/pve-agent-release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false

  pve-agent-repository:
    needs: pve-agent-package
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'pve-agent-')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt.yml
    secrets:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
