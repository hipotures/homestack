[[pve.tokens]]
id = "root@pam!parity"
secret = "00000000-0000-0000-0000-00000000000a"
acl = { "/" = ["*"] }

# The server's token: as in phase 2, plus file-read on the workspaces
# (decision 5) and unrestricted guest access on the Gold VMs only.
[[pve.tokens]]
id = "homestack@pve!server"
secret = "00000000-0000-0000-0000-00000000000b"
acl = { "/" = ["Datastore.Audit", "Mapping.Audit", "Pool.Audit", "SDN.Audit", "Sys.Audit", "VM.Audit", "VM.GuestAgent.Audit", "VM.Config.Disk"], "/vms" = ["VM.GuestAgent.FileRead"], "/vms/100" = ["VM.GuestAgent.Unrestricted"], "/vms/102" = ["VM.GuestAgent.Unrestricted"] }

# The server's token without guest access beyond audit (Rust tests only).
[[pve.tokens]]
id = "auditor@pve!server"
secret = "00000000-0000-0000-0000-00000000000c"
acl = { "/" = ["Datastore.Audit", "Mapping.Audit", "Pool.Audit", "SDN.Audit", "Sys.Audit", "VM.Audit", "VM.GuestAgent.Audit"] }

# The server reads only the VMs of its pools (phase 5).
[[pve.pools]]
poolid = "homestack-gold"
vms = [100, 102]

[[pve.pools]]
poolid = "homestack"
vms = [220, 221, 222, 223, 224, 225, 226, 227, 228, 229]
