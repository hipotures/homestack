# Phase 2: every read through both implementations on one cluster.
#
# pve-example-1 holds Gold (stopped) and the workspaces; pve-example-2 is
# offline. The cases the plan names are all here: a node offline (VM 204 and
# homestack-storage-2), a workspace without home (203), a wrong home serial
# (205), detached HomeStack volumes (209, 210), a homestack-alien VM (206),
# plus a guest agent that does not answer (202) and an unmanaged VM (207).
#
# Python reads guests with `exec` (findmnt, blkid, df, ...); the server uses
# the audit-level agent commands. Both read the same guest description, and
# the normalization rules drop only the guest calls themselves.

[scenario]
name = "status-cluster"
phase = "2"
description = "Global and per-VM status, storage, orphans, discovery, networks and Gold readiness"

[homestack]
config = "python/config.example.toml"

[[parity]]
python = ["status", "--json"]
rust = "GET /v1/status"
normalize = "status-global"

[[parity]]
python = ["status", "200", "--json"]
rust = "GET /v1/workspaces/200"
normalize = "status-workspace"

[[parity]]
python = ["status", "test1", "--json"]
rust = "GET /v1/workspaces/test1"
normalize = "status-workspace"

[[parity]]
python = ["status", "201", "--json"]
rust = "GET /v1/workspaces/201"
normalize = "status-workspace"

[[parity]]
python = ["status", "202", "--json"]
rust = "GET /v1/workspaces/202"
normalize = "status-workspace"

[[parity]]
python = ["status", "205", "--json"]
rust = "GET /v1/workspaces/205"
normalize = "status-workspace"

[[parity]]
python = ["status", "alien1", "--json"]
rust = "GET /v1/workspaces/alien1"
normalize = "status-workspace"

[[parity]]
python = ["status", "--json"]
rust = "GET /v1/storage"
normalize = "storage-from-status"

[[parity]]
python = ["status", "--json"]
rust = "GET /v1/orphans"
normalize = "orphans-from-status"

[[parity]]
python = ["@discovery"]
rust = "GET /v1/discovery"
normalize = "same"

[[parity]]
python = ["@networks"]
rust = "GET /v1/networks"
normalize = "same"

[[parity]]
python = ["@gold-readiness"]
rust = "GET /v1/gold/readiness"
normalize = "gold-readiness"

[pve]
