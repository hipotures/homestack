node = "pve-example-1"
status = "stopped"
[pve.vms.config]
name = "gold"
tags = "homestack-gold"
agent = "1"
boot = "order=scsi0;ide2;net0"
ide2 = "example-storage:vm-100-cloudinit,media=cdrom"
net0 = "virtio=BC:24:11:00:01:00,bridge=vmbr0,firewall=1"
scsi0 = "example-storage:vm-100-disk-0,iothread=1,size=16G"
sshkeys = "ssh-ed25519%20AAAAC3NzaC1lZDI1NTE5AAAAITEST%20developer%40desktop%0A"
memory = 4096

