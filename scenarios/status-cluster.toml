# Not HomeStack's.
[[pve.vms]]
vmid = 207
node = "pve-example-1"
status = "running"
config = { name = "desktop" }

# Python runs as root on a node today.
[[pve.tokens]]
id = "root@pam!parity"
secret = "00000000-0000-0000-0000-00000000000a"
acl = { "/" = ["*"] }

# The server's token: PVEAuditor plus VM.Config.Disk, which Proxmox requires
# to list VM volumes (the orphan scan); see docs/migration/phase-2.md.
[[pve.tokens]]
id = "homestack@pve!server"
secret = "00000000-0000-0000-0000-00000000000b"
acl = { "/" = ["Datastore.Audit", "Mapping.Audit", "Pool.Audit", "SDN.Audit", "Sys.Audit", "VM.Audit", "VM.GuestAgent.Audit", "VM.Config.Disk"] }
