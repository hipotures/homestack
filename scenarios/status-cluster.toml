# Running, but the guest agent does not answer.
[[pve.vms]]
vmid = 202
node = "pve-example-1"
status = "running"
[pve.vms.config]
name = "noagent"
tags = "homestack-ws"
scsi0 = "example-storage:vm-202-hs-root-default,size=16G"
scsi1 = "example-storage:vm-202-hs-home-developer,serial=HS_HOME_202,size=30G"

