# Phase 4: the public keys a new workspace gets from Gold (mapping C5).
#
# One Gold per source: usable `sshkeys` (100); the user's file when
# `sshkeys` is unusable (103); root's file when the user's is not usable
# (104); nothing usable (102); a stopped Gold without keys (105); a Gold
# whose agent does not answer (106). Gold sits on another node than the
# configured one, so every request must go to Gold's node.

[scenario]
name = "workspace-keys"
phase = "4"
description = "Workspace keys from Gold"

[homestack]
config = "python/config.example.toml"

[[parity]]
python = ["@workspace-keys"]
rust = "@workspace-keys"
normalize = "workspace-keys"
expect.body = { ok = true, keys = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITEST developer@desktop\n", source = "Gold VM 100:qm sshkeys" }

[[parity]]
python = ["@workspace-keys", "103"]
rust = "@workspace-keys 103"
normalize = "workspace-keys"
expect.body = { ok = true, keys = "ssh-ed25519 AAAAUSER developer@desktop\nsk-ssh-ed25519@openssh.com AAAASK developer@key\n", source = "Gold VM 103:/home/developer/.ssh/authorized_keys" }

[[parity]]
python = ["@workspace-keys", "104"]
rust = "@workspace-keys 104"
normalize = "workspace-keys"
expect.body = { ok = true, keys = "ssh-ed25519 AAAAROOT root@gold\n", source = "Gold VM 104:/root/.ssh/authorized_keys" }

[[parity]]
python = ["@workspace-keys", "102"]
rust = "@workspace-keys 102"
normalize = "workspace-keys"
expect.body = { ok = false, error = "Gold VM 102 has no usable public keys in its Proxmox sshkeys setting, /home/developer/.ssh/authorized_keys, or /root/.ssh/authorized_keys" }

[[parity]]
python = ["@workspace-keys", "105"]
rust = "@workspace-keys 105"
normalize = "workspace-keys"
expect.body = { ok = false, error = "Gold VM 105 is stopped and its Proxmox sshkeys setting does not contain usable public keys." }

[[parity]]
python = ["@workspace-keys", "106"]
rust = "@workspace-keys 106"
normalize = "workspace-keys"
expect.body = { ok = false, error = "Gold VM 106 QEMU Guest Agent is not available" }

[[parity]]
python = ["@workspace-keys", "199"]
rust = "@workspace-keys 199"
normalize = "workspace-keys"
expect.body = { ok = false, error = "Gold VM 199 does not exist" }

[pve]
version = { release = "9.2", version = "9.2.21", repoid = "4f6e0ac86f9e8c7f" }

[[pve.nodes]]
name = "pve-example-1"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 591184

[[pve.nodes]]
name = "pve-example-2"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 591184

[[pve.vms]]
vmid = 100
node = "pve-example-2"
status = "running"
[pve.vms.config]
name = "gold"
tags = "homestack-gold"
agent = "1"
sshkeys = "ssh-ed25519%20AAAAC3NzaC1lZDI1NTE5AAAAITEST%20developer%40desktop%0A"
[pve.vms.guest]
hostname = "gold"
users = ["root", "developer"]

# No usable source: no sshkeys, an old-format user file, no root file.
[[pve.vms]]
vmid = 102
node = "pve-example-2"
status = "running"
config = { name = "gold2", tags = "homestack-gold", agent = "1" }
[pve.vms.guest]
hostname = "gold2"
users = ["root", "developer"]
files = { "/home/developer/.ssh/authorized_keys" = "rsa AAAA old-format\n" }

# Unusable sshkeys, a usable user file (comments and blank lines skipped).
[[pve.vms]]
vmid = 103
node = "pve-example-2"
status = "running"
config = { name = "gold3", tags = "homestack-gold", agent = "1", sshkeys = "not-a-key" }
[pve.vms.guest]
hostname = "gold3"
users = ["root", "developer"]
files = { "/home/developer/.ssh/authorized_keys" = "# desktop\n\n  ssh-ed25519 AAAAUSER developer@desktop  \nsk-ssh-ed25519@openssh.com AAAASK developer@key\n", "/root/.ssh/authorized_keys" = "ssh-ed25519 AAAAROOT root@gold\n" }

# An empty user file: root's keys.
[[pve.vms]]
vmid = 104
node = "pve-example-2"
status = "running"
config = { name = "gold4", tags = "homestack-gold", agent = "1" }
[pve.vms.guest]
hostname = "gold4"
users = ["root", "developer"]
files = { "/home/developer/.ssh/authorized_keys" = "", "/root/.ssh/authorized_keys" = "ssh-ed25519 AAAAROOT root@gold\n" }

[[pve.vms]]
vmid = 105
node = "pve-example-2"
status = "stopped"
config = { name = "gold5", tags = "homestack-gold", agent = "1" }

# Running, but no agent answers.
[[pve.vms]]
vmid = 106
node = "pve-example-2"
status = "running"
config = { name = "gold6", tags = "homestack-gold", agent = "1" }

[[pve.tokens]]
id = "root@pam!parity"
secret = "00000000-0000-0000-0000-00000000000a"
acl = { "/" = ["*"] }

# The server's token: audit, plus file-read on Gold; no `exec` anywhere.
[[pve.tokens]]
id = "homestack@pve!server"
secret = "00000000-0000-0000-0000-00000000000b"
acl = { "/" = ["Datastore.Audit", "Mapping.Audit", "Pool.Audit", "SDN.Audit", "Sys.Audit", "VM.Audit", "VM.GuestAgent.Audit"], "/vms" = ["VM.GuestAgent.FileRead"] }

# The server reads only the VMs of its pools (phase 5).
[[pve.pools]]
poolid = "homestack-gold"
vms = [100, 102, 103, 104, 105, 106]
