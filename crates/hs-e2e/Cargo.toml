[package]
name = "hs-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
hs-deploy = { version = "0.1.0", path = "../hs-deploy" }
hs-config = { version = "0.1.0", path = "../hs-config" }
hs-model = { version = "0.1.0", path = "../hs-model" }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
instant-acme = { version = "0.8.5", features = ["rcgen", "x509-parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
rustix = { version = "1.1.5", features = ["termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net", "process", "signal", "io-util", "io-std"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }

[[bin]]
name = "homestack-e2e"
path = "src/main.rs"
