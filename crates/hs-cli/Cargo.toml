[package]
name = "hs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
hs-core = { version = "0.1.0", path = "../hs-core" }
base64 = "0.23.1"
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
hs-client = { version = "0.1.0", path = "../hs-client" }
hs-install = { version = "0.1.0", path = "../hs-install" }
hs-config = { version = "0.1.0", path = "../hs-config" }
hs-deploy = { version = "0.1.0", path = "../hs-deploy" }
hs-model = { version = "0.1.0", path = "../hs-model" }
hs-service-status = { version = "0.1.0", path = "../hs-service-status" }
hs-pve = { version = "0.1.0", path = "../hs-pve" }
reqwest = { version = "0.13.5", default-features = false }
ratcn = "=0.0.5"
rpassword = "7.5.4"
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
regex = "1.13.1"
sha2 = "0.11.0"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-util"] }
toml = "1.1.8"
toml_edit = "0.25.17"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
yaml-rust2 = { version = "0.13.0", default-features = false }
zeroize = "1.9.1"


[[bin]]
name = "homestack"
path = "src/main.rs"
