[package]
name = "pve-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
form_urlencoded = "1.2.2"
hs-model = { version = "0.1.0", path = "../hs-model" }
percent-encoding = "2.3.2"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
