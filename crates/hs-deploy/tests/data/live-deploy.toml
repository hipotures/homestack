# deploy.toml of the live gate of phase 11 (live_deploy.rs): three test
# instances, one per node, with the test token and pool homestack-test,
# the test Gold 248 (live-server.toml). The image is replaced by
# HOMESTACK_LIVE_IMAGE. The containers are removed after the gate.
# Names test1-3 and addresses .240-.242 are the test instances' own
# (A records in hs.efez.net), apart from the installed servers api1-3.
image = "ghcr.io/hipotures/homestack-server:replaced-by-the-test"
domain = "hs.efez.net"
template_storage = "local"
bridge = "vmbr0"
cidr = 24
gateway = "192.168.100.1"

[pve]
endpoints = ["https://pve1.homestack.app:8006", "https://pve2.homestack.app:8006", "https://pve3.homestack.app:8006"]
deploy_token_file = "~/.config/homestack/pve-token-deploy"

[server]
pve_token_file = "~/.config/homestack/pve-token-test"
pool = "homestack-test"
config_file = "../../../hs-server/tests/data/live-server.toml"
api_token_file = "~/.config/homestack/api-token-live"

[acme]
ovh_file = "~/.config/homestack/integrations/ovh-dns"
zone = "efez.net"
dir = "~/.config/homestack/acme"

[[instances]]
name = "test1"
node = "pve1"
ctid = 997
address = "192.168.100.240"
storage = "local-zfs"

[[instances]]
name = "test2"
node = "pve2"
ctid = 998
address = "192.168.100.241"
storage = "local-lvm"

[[instances]]
name = "test3"
node = "pve3"
ctid = 999
address = "192.168.100.242"
storage = "local-lvm"
