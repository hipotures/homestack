[package]
name = "hs-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
hickory-resolver = "0.26.3"
hs-core = { version = "0.1.0", path = "../hs-core" }
hs-model = { version = "0.1.0", path = "../hs-model" }
rustls-platform-verifier = "0.7.1"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
hs-client = { version = "0.1.0", path = "../hs-client" }
hs-pve = { version = "0.1.0", path = "../hs-pve" }
instant-acme = { version = "0.8.5", features = ["rcgen", "x509-parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.34"
toml = "1.1.8"
toml_edit = "0.25.17"
url = { version = "2.5.8", features = ["serde"] }
x509-parser = "0.18.1"

[dev-dependencies]
hs-pve = { version = "0.1.0", path = "../hs-pve" }
tempfile = "3.27.0"

[[bin]]
name = "homestack-deploy"
path = "src/main.rs"
