[package]
name = "hs-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
hs-core = { version = "0.1.0", path = "../hs-core" }
hs-model = { version = "0.1.0", path = "../hs-model" }
hs-pve = { version = "0.1.0", path = "../hs-pve" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
utoipa = "6.0.0"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
hs-config = { path = "../hs-config" }
pve-sim = { path = "../pve-sim" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.1.8"

[[bin]]
name = "homestack-server"
path = "src/main.rs"
