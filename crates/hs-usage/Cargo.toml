[package]
name = "hs-usage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
hs-model = { version = "0.1.0", path = "../hs-model" }
hs-service-status = { path = "../hs-service-status" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[[bin]]
name = "homestack-usage"
path = "src/main.rs"
