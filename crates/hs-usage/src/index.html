<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI usage</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/aiusage-tokens.css"><style>
* { box-sizing: border-box; }
main { max-width: 2400px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 16px; }
[hidden] { display: none !important; }
h1 { font-size: 20px; margin: 0; font-weight: 600; }
.scope { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 6px; max-width: 180px; }
.mode { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.mode input { accent-color: var(--codex); }
.compare { --metric-width: 260px; --agent-width: 200px; width: calc(var(--metric-width) + var(--agent-count, 2) * var(--agent-width) + 38px); max-width: 100%; margin-inline: auto; padding: 18px; overflow-x: auto; }
.compare table { font-size: 14px; width: calc(var(--metric-width) + var(--agent-count, 2) * var(--agent-width)); table-layout: fixed; }
.compare th:first-child { width: var(--metric-width); }
.compare td .note, .compare thead .note { margin-left: auto; }
.compare caption { text-align: left; font-weight: 600; font-size: 18px; padding-bottom: 8px; }
.compare th, .compare td { padding: 12px 16px; vertical-align: top; }
.compare thead th { z-index: 1; }
.compare tbody th { position: static; font-weight: 400; }
.compare .primary { font-size: 18px; font-weight: 600; }
@media (max-width: 600px) { .compare { --metric-width: 160px; --agent-width: 160px; } .compare .primary { font-size: 16px; } }
.compare .note { display: block; white-space: normal; max-width: 360px; margin-top: 4px; }
.compare .compare-footer { margin-top: 14px; max-width: none; }
.compare tbody th:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); }
.theme { cursor: pointer; padding: 4px 10px; }
.updated { color: var(--muted); font-size: 12px; margin-left: auto; }
.error { border: 1px solid var(--up); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
.error::before { content: "⚠ "; color: var(--up); }
.overview { margin-bottom: 16px; }
.overview.has-summary { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(0, 4fr); gap: 12px; align-items: stretch; }
.summary { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; }
.summary .tile { border-color: color-mix(in oklab, var(--codex) 40%, var(--border-strong)); }
.summary .value { font-size: 28px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .overview.has-summary { grid-template-columns: minmax(0, 1fr); } .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto; } }
@media (max-width: 480px) { .summary { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile, .card { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; }
.tile { padding: 12px 14px; }
.tile .label { color: var(--text-2); font-size: 12px; }
.tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
.note { color: var(--muted); font-size: 12px; }
.tile .row { display: flex; align-items: baseline; gap: 8px; }
.tile .delta { margin-left: auto; color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, max(380px, (100% - 24px) / 3)), 1fr)); gap: 12px; }
.card { padding: 14px 14px 10px; min-width: 0; }
.card-head { display: flex; align-items: baseline; gap: 8px; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0; }
.card .unit { color: var(--muted); font-size: 12px; }
.card .toggle { margin-left: auto; font: inherit; font-size: 12px; color: var(--text-2); background: none; border: none; cursor: pointer; text-decoration: underline; }
.card-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.card-actions .toggle { margin-left: 0; }
.copy { font: inherit; font-size: 12px; color: var(--text-2); background: none; border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px 6px; cursor: pointer; }
.copy-all { cursor: pointer; }
.version { margin-top: 24px; color: var(--muted); font-size: 11px; text-align: center; }
.table-wrap { overflow-x: auto; max-height: 260px; overflow-y: auto; }
table { border-collapse: collapse; font-size: 12px; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }

.chart { width:100%; height:300px; min-width:0; }
.chart-empty { height:300px; display:grid; place-items:center; color:var(--muted); }
.status {font-size:12px; color:var(--text-2)}
.card .note {min-height:18px}
button:focus-visible,select:focus-visible {outline:2px solid var(--codex);outline-offset:2px}
</style>
<script defer src="/assets/echarts-6.1.0.min.js"></script>
<script defer src="/assets/aiusage-echarts-theme.js"></script>
<script defer src="/assets/dashboard.js"></script>
<script type="module" src="/assets/datastar-1.0.4.js"></script>
</head><body>
<main data-signals="window.usage.initial()"
 data-init="window.usage.restore(el)"
 data-effect="@get('/api/dashboard/events', {payload:{agent:$agent,host:$host,project:$project,range:$range,epoch:window.usage.select({agent:$agent,host:$host,project:$project,range:$range},$_sync)},retry:'always',retryMaxCount:1000,retryInterval:3000})">
<header><h1>AI usage</h1>
<select class="scope" id="agent" aria-label="Agent" data-bind:agent data-attr:disabled="$_compare"><option value="all">All agents</option><option value="claude">Claude Code</option><option value="codex">Codex</option></select>
<select class="scope" id="host" aria-label="Server" data-bind:host><option value="*">All servers</option></select>
<select class="scope" id="project" aria-label="Project" data-bind:project><option value="*">All projects</option></select>
<select class="scope" id="range" aria-label="Time range" data-bind:range><option value="1h">1 h</option><option value="24h">24 h</option><option value="7d">7 days</option><option value="30d">30 days</option><option value="90d">90 days</option></select>
<label class="scope mode"><input id="compare" type="checkbox" role="switch" data-bind:_compare data-on:change="if($_compare) $agent='all'; window.usage.mode($_compare)"> Compare agents</label>
<span class="updated" id="updated" aria-live="polite">Connecting…</span>
<button class="scope copy-all" id="copy-all" type="button" title="Copy all chart data as JSON Lines">⧉ Copy all</button>
<button class="scope theme" id="theme" type="button">Theme</button></header>
<div data-effect="window.usage.mode($_compare)"></div>
<div data-effect="if($_packet) window.usage.apply(JSON.parse($_packet))"></div>
<button id="resync" type="button" hidden data-on:click="$_sync++">Resynchronize</button>
<div class="error" id="error" role="status" hidden></div>
<section class="card compare" id="comparison" aria-label="Agent comparison" hidden data-ignore-morph></section>
<section class="overview has-summary" id="overview" aria-label="Usage overview"><div class="summary" id="summary"></div><section class="tiles" id="tiles" aria-label="Usage by agent"></section></section>
<section class="cards" id="cards" data-ignore-morph data-ignore></section>
<footer class="version">AI Usage · __HOMESTACK_USAGE_VERSION__ · Datastar 1.0.4 · Apache ECharts 6.1.0 · <a href="/assets/datastar-LICENSE.md">Datastar license</a> · <a href="/assets/echarts-LICENSE.txt">ECharts license</a> · <a href="/assets/echarts-NOTICE.txt">Notices</a></footer>
</main></body></html>
