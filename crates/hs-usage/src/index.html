<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI usage</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.05);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --critical: #d03b3b; --spike: rgba(208,59,59,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 2400px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 16px; }
[hidden] { display: none !important; }
h1 { font-size: 20px; margin: 0; font-weight: 600; }
.scope { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 4px 6px; max-width: 180px; }
.mode { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.mode input { accent-color: var(--s1); }
.compare { padding: 18px; overflow-x: auto; }
.compare table { font-size: 14px; min-width: 560px; }
.compare caption { text-align: left; font-weight: 600; font-size: 18px; padding-bottom: 8px; }
.compare th, .compare td { padding: 12px 16px; vertical-align: top; }
.compare thead th { z-index: 1; }
.compare tbody th { position: static; font-weight: 400; }
.compare .primary { font-size: 18px; font-weight: 600; }
.compare .note { display: block; white-space: normal; max-width: 360px; margin-top: 4px; }
.compare .compare-footer { margin-top: 14px; max-width: none; }
.compare tbody th:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); }
.theme { cursor: pointer; padding: 4px 10px; }
.updated { color: var(--muted); font-size: 12px; margin-left: auto; }
.error { border: 1px solid var(--critical); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
.error::before { content: "⚠ "; color: var(--critical); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile, .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; }
.tile { padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
.note { color: var(--muted); font-size: 12px; }
.tile .row { display: flex; align-items: baseline; gap: 8px; }
.tile .delta { margin-left: auto; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.tile svg { margin-top: 6px; height: 28px; }
.insights { list-style: none; margin: 8px 0 0; padding: 0; }
.insights li { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.insights li:last-child { border-bottom: none; }
.insights .when { color: var(--muted); font-size: 12px; min-width: 52px; font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; font-weight: 600; border: 1px solid var(--critical); border-radius: 4px; padding: 0 6px; }
.badge::before { content: "▲ "; color: var(--critical); }
.heat { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 2px; margin-top: 10px; font-size: 11px; color: var(--muted); }
.heat .cell { aspect-ratio: 1; border-radius: 2px; background: var(--grid); }
.heat .cell:hover, .heat .cell:focus { outline: 2px solid var(--ink-2); outline-offset: -1px; }
.heat-scale { display: flex; align-items: center; gap: 3px; margin-top: 8px; color: var(--muted); font-size: 11px; }
.heat-scale i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.spike-key { border: 1px solid var(--critical); background: var(--spike) !important; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, max(380px, (100% - 24px) / 3)), 1fr)); gap: 12px; }
.card { padding: 14px 14px 10px; min-width: 0; }
.card-head { display: flex; align-items: baseline; gap: 8px; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0; }
.card .unit { color: var(--muted); font-size: 12px; }
.card .toggle { margin-left: auto; font: inherit; font-size: 12px; color: var(--ink-2); background: none; border: none; cursor: pointer; text-decoration: underline; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 4px; color: var(--ink-2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.loading { opacity: 0.5; transition: opacity 0.2s; }
.table-wrap { overflow-x: auto; max-height: 260px; overflow-y: auto; }
table { border-collapse: collapse; font-size: 12px; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
#tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); z-index: 10; min-width: 140px; }
#tip .when { color: var(--ink-2); margin-bottom: 4px; }
#tip .row { display: flex; align-items: center; gap: 8px; }
#tip .row b { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
#tip .key { width: 12px; height: 2px; display: inline-block; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AI usage</h1>
    <select class="scope" id="tool" aria-label="Agent"></select>
    <select class="scope" id="host" aria-label="Server"></select>
    <select class="scope" id="project" aria-label="Project"></select>
    <select class="scope" id="range" aria-label="Time range"></select>
    <label class="scope mode"><input id="compare" type="checkbox" role="switch"> Compare agents</label>
    <span class="updated" id="updated"></span>
    <button class="scope theme" id="theme" type="button"></button>
  </header>
  <div class="error" id="error" hidden></div>
  <div class="error" id="coverage" hidden></div>
  <section class="card compare" id="comparison" aria-label="Agent comparison" hidden></section>
  <section class="tiles" id="tiles"></section>
  <section class="cards" id="cards"></section>
</main>
<div id="tip" hidden></div>
<script>
"use strict";
const RANGES = [
  { id: "24h", label: "24 h", seconds: 86400, step: 3600 },
  { id: "7d", label: "7 days", seconds: 7 * 86400, step: 6 * 3600 },
  { id: "30d", label: "30 days", seconds: 30 * 86400, step: 86400 },
  { id: "90d", label: "90 days", seconds: 90 * 86400, step: 86400 },
];
// Add an adapter here to expose another agent in both views. Unreported
// capabilities stay absent instead of inventing comparable measurements.
const AGENTS = [
  { id: "claude", label: "Claude Code", prefix: "claude_code", metrics: () => ({
    tokens: "claude_code_token_usage_tokens_total", tokenLabel: "type",
    types: { input: "input", cached: "cacheRead", written: "cacheCreation", output: "output" },
    cost: "claude_code_cost_usage_USD_total", sessions: "claude_code_session_count_total",
    active: "claude_code_active_time_seconds_total", commits: "claude_code_commit_count_total",
    lines: "claude_code_lines_of_code_count_total",
  }) },
  { id: "codex", label: "Codex", prefix: "codex", metrics: c => ({
    tokens: c.tokens, tokenLabel: "token_type", inclusiveInput: true,
    types: { total: "total", input: "input", cached: "cached_input", written: "cache_write_input", output: "output", reasoning: "reasoning_output" },
    estimated: true, convertCost: rows => costRows(rows, c), costNote: () => costNote(c),
    costUnavailable: () => c.coverage || !c.prices || c.missing.size > 0,
    sessions: c.threads,
  }) },
];
const TOOLS = [{ id: "all", label: "All agents" }, ...AGENTS.map(({id, label}) => ({id, label}))];
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5"];
// Each process exports its own cumulative series (new instance label), so
// usage in a window is the growth of every series' last value, with series
// that did not exist before the window counted from zero.
const LOOKBACK = "100d";
const growth = (selector, by, window, metric = scoped(selector)) =>
  `sum by (${by}) (clamp_min(last_over_time(${metric}[${LOOKBACK}]) - ` +
  `(last_over_time(${metric}[${LOOKBACK}] offset ${window}s) or last_over_time(${metric}[${LOOKBACK}]) * 0), 0))`;

// Server and project are OTEL resource attributes; ANY keeps every series,
// including those without the label.
const SCOPES = [{ id: "host", label: "host_name", all: "All servers" }, { id: "project", label: "project", all: "All projects" }];
const ANY = "*";
let range = RANGES[0], tool = TOOLS[0], comparison = false;
let loadVersion = 0;
const scope = { host: ANY, project: ANY };
try {
  comparison = localStorage.getItem("comparison") === "true";
  range = RANGES.find(r => r.id === localStorage.getItem("range")) || range;
  tool = TOOLS.find(t => t.id === localStorage.getItem("tool")) || tool;
  for (const s of SCOPES) scope[s.id] = localStorage.getItem(s.id) || ANY;
} catch (_) {}
function scoped(selector) {
  const matchers = SCOPES.filter(s => scope[s.id] !== ANY).map(s => `${s.label}=${JSON.stringify(scope[s.id])}`).join(",");
  if (!matchers) return selector;
  return selector.includes("{") ? selector.replace("{", `{${matchers},`) : `${selector}{${matchers}}`;
}
const shows = id => tool.id === "all" || tool.id === id;
const tables = new Set();

async function prom(path, params) {
  const response = await fetch(path + "?" + new URLSearchParams(params));
  const body = await response.json().catch(() => null);
  if (!response.ok || !body || body.status !== "success") {
    throw new Error(body && body.error ? body.error : `Prometheus: HTTP ${response.status}`);
  }
  return body.data;
}
const instant = (query, time) => prom("/api/v1/query", { query, time }).then(d => d.result);
const series = (query, start, end, step) =>
  prom("/api/v1/query_range", { query, start, end, step }).then(d => d.result);

// Codex metric names depend on its exporter's unit and instrument type.
async function codexMetrics() {
  const names = await prom("/api/v1/label/__name__/values", {});
  const pick = re => names.find(n => re.test(n) && n.endsWith("_total")) || names.find(n => re.test(n) && n.endsWith("_sum"));
  return { tokens: pick(/^codex_turn_token_usage/), threads: pick(/^codex_thread_started/),
    prices: null, missing: new Set(), coverage: "" };
}

// A globally present metric can still have no attribution for the selected
// server/project. Keep missing data distinct from measured zero usage.
function coverageNote(rows) {
  const selected = SCOPES.filter(s => scope[s.id] !== ANY);
  if (!rows.length || !selected.length || rows.some(r => selected.every(s => r.metric[s.label] === scope[s.id]))) return "";
  const missing = selected.filter(s => !rows.some(r => r.metric[s.label]));
  if (missing.length) return "Codex metrics have no " + missing.map(s => s.id === "host" ? "server (host_name)" : "project").join(" or ") +
    " label. Usage cannot be attributed to this selection; choose All servers / All projects to see unattributed usage.";
  return "No Codex metrics match the selected server and project. Missing data is not zero usage.";
}

const fmt = {
  tokens: v => v >= 1e9 ? (v / 1e9).toFixed(2) + " G" : v >= 1e6 ? (v / 1e6).toFixed(1) + " M" : v >= 1e3 ? (v / 1e3).toFixed(1) + " k" : String(Math.round(v)),
  usd: v => v > 0 && v < 0.01 ? "<$0.01" : "$" + v.toFixed(2),
  exact: v => Math.round(v).toLocaleString("en-GB"),
  count: v => String(Math.round(v)),
  hours: v => v >= 3600 ? (v / 3600).toFixed(1) + " h" : Math.round(v / 60) + " min",
  percent: v => (v * 100).toFixed(1) + "%",
  lines: v => v >= 1e3 ? (v / 1e3).toFixed(1) + " k" : String(Math.round(v)),
};
// Normalized comparison rows, in importance order. Output includes reasoning;
// reasoning is a detail row and is never added to the total a second time.
const COMPARISON_ROWS = [
  { id: "cost", label: "Cost", format: fmt.usd },
  { id: "total", label: "Total tokens", format: fmt.exact },
  { id: "input", label: "Uncached input tokens", format: fmt.exact },
  { id: "cached", label: "Cached input tokens", format: fmt.exact },
  { id: "written", label: "Cache write tokens", format: fmt.exact },
  { id: "output", label: "Output tokens", detail: "Includes reasoning when reported in output", format: fmt.exact },
  { id: "reasoning", label: "Reasoning tokens", detail: "Subset of output; not added to total", format: fmt.exact },
  { id: "cacheHit", label: "Cache hit", format: fmt.percent },
  { id: "sessions", label: "New sessions", format: fmt.count },
  { id: "active", label: "Active time", format: fmt.hours },
  { id: "commits", label: "Commits", format: fmt.count },
  { id: "added", label: "Lines added", format: fmt.exact },
  { id: "removed", label: "Lines removed", format: fmt.exact },
];
const sumRows = rows => rows.length ? rows.reduce((sum, r) => sum + Number(r.value[1]), 0) : null;
function tokenValues(rows, metric) {
  if (!rows.length) return {};
  const values = new Map(rows.map(r => [r.metric[metric.tokenLabel], Number(r.value[1])]));
  const get = id => metric.types[id] ? (values.get(metric.types[id]) || 0) : null;
  const cached = get("cached"), written = get("written"), rawInput = get("input"), output = get("output");
  const input = metric.inclusiveInput ? Math.max(0, rawInput - (cached || 0) - (written || 0)) : rawInput;
  const allInput = (input || 0) + (cached || 0) + (written || 0);
  return { total: metric.types.total ? get("total") : allInput + (output || 0), input, cached, written, output,
    reasoning: get("reasoning"), cacheHit: allInput > 0 && cached != null ? cached / allInput : null };
}
const tokenSelector = metric => metric.tokens + (metric.types.total ? `{${metric.tokenLabel}=${JSON.stringify(metric.types.total)}}` : "");
async function readAgent(agent, codex, now) {
  const metric = { types: {}, ...agent.metrics(codex) }, values = {}, notes = {};
  const read = (selector, by = "") => selector ? instant(growth(selector, by, range.seconds), now) : Promise.resolve([]);
  const [tokens, cost, sessions, active, commits, lines] = await Promise.all([
    read(metric.tokens, metric.tokenLabel),
    read(metric.cost || (metric.convertCost && metric.tokens), metric.convertCost ? `model,${metric.tokenLabel}` : ""),
    read(metric.sessions), read(metric.active), read(metric.commits), read(metric.lines, "type"),
  ]);
  Object.assign(values, tokenValues(tokens, metric));
  values.cost = sumRows(metric.convertCost ? metric.convertCost(cost) : cost);
  if (metric.costUnavailable?.()) values.cost = null;
  values.sessions = sumRows(sessions); values.active = sumRows(active); values.commits = sumRows(commits);
  if (lines.length) for (const type of ["added", "removed"]) values[type] = Number(lines.find(r => r.metric.type === type)?.value[1] || 0);
  for (const row of COMPARISON_ROWS) {
    const supported = row.id === "cost" ? metric.cost || metric.convertCost :
      row.id === "cacheHit" || row.id === "total" ? metric.tokens :
      ["added", "removed"].includes(row.id) ? metric.lines : metric[row.id] || metric.types[row.id];
    notes[row.id] = supported ? "No data for the selected filters and time range" : "Not reported by this agent";
  }
  if (metric.estimated) notes.cost = metric.costNote();
  return { ...agent, metric, values, notes };
}
function renderComparison(agents, now) {
  const section = document.getElementById("comparison"), table = el("table"), caption = el("caption", "", "Agent comparison");
  table.append(caption);
  const head = el("thead"), heading = el("tr");
  const first = el("th", "", "Metric"); first.scope = "col"; heading.append(first);
  for (const agent of agents) {
    const cell = el("th", "", agent.label); cell.scope = "col";
    cell.append(el("span", "note", agent.metric.estimated ? "Estimated API cost" : agent.metric.cost ? "Reported cost" : "Cost not reported")); heading.append(cell);
  }
  head.append(heading); table.append(head);
  const body = el("tbody");
  for (const [index, spec] of COMPARISON_ROWS.entries()) {
    const row = el("tr", index < 2 ? "primary" : ""), label = el("th", "", spec.label); label.scope = "row";
    if (spec.detail) label.append(el("span", "note", spec.detail)); row.append(label);
    for (const agent of agents) {
      const value = agent.values[spec.id], cell = el("td", "", value == null ? "—" : spec.format(value));
      cell.title = value == null || spec.id === "cost" && agent.metric.estimated ? agent.notes[spec.id] : spec.format(value);
      if (value == null) cell.append(el("span", "note", agent.notes[spec.id]));
      row.append(cell);
    }
    body.append(row);
  }
  table.append(body);
  const selection = SCOPES.map(s => scope[s.id] === ANY ? s.all : scope[s.id]).join(" · ");
  section.replaceChildren(table, el("div", "note compare-footer", `${range.label} · ${selection} · as of ${new Date(now * 1000).toLocaleString("en-GB")}`),
    el("div", "note compare-footer", "Estimated costs use the startup price catalog at standard API rates, not subscription charges. Unattributed historical data is excluded by server and project filters. — means unavailable, not zero."));
}

function panels(agents, step) {
  const shared = (id, title, unit, format, options = {}) => ({ title, unit, format, grouped: true, ...options,
    parts: agents.flatMap(agent => {
      const m = agent.metric;
      if (id === "cost") return m.cost || m.convertCost && m.tokens ? [{ query: growth(m.cost || m.tokens, m.convertCost ? `model,${m.tokenLabel}` : "", step),
        transform: m.convertCost, name: () => agent.label + (m.estimated ? " (estimated)" : "") }] : [];
      if (id === "total") return m.tokens ? [{ query: growth(tokenSelector(m), "", step), name: () => agent.label }] : [];
      if (m.types[id]) return m.tokens ? [{ query: growth(m.tokens, m.tokenLabel, step), name: () => agent.label,
        transform: rows => {
          const times = [...new Set(rows.flatMap(r => r.values.map(([t]) => t)))];
          return [{ metric: {}, values: times.map(t => [t, tokenValues(rows.map(r => ({ metric: r.metric, value: [t, r.values.find(([time]) => time === t)?.[1] || 0] })), m)[id] || 0]) }];
        } }] : [];
      return m[id] ? [{ query: growth(m[id], "", step), name: () => agent.label }] : [];
    }),
  });
  const list = [shared("cost", "Cost over time", "USD · estimates labelled", fmt.usd),
    { title: "Cost by model", unit: "USD · estimates labelled", format: fmt.usd,
      parts: agents.filter(a => a.metric.cost || a.metric.convertCost && a.metric.tokens).map(a => ({
        query: growth(a.metric.cost || a.metric.tokens, a.metric.convertCost ? `model,${a.metric.tokenLabel}` : "model", step),
        transform: a.metric.convertCost, name: m => `${a.label}${a.metric.estimated ? " (estimated)" : ""} · ${m.model || "?"}`,
      })) },
    shared("total", "Tokens over time", "all token types", fmt.tokens, { spikes: true }),
    ...COMPARISON_ROWS.filter(r => ["input", "cached", "written", "output"].includes(r.id)).map(r => shared(r.id, r.label, "by agent", fmt.tokens)),
    shared("sessions", "Sessions", "new sessions by agent", fmt.count, { scale: "integer" }),
    shared("active", "Active time", "reported seconds", fmt.hours, { scale: "time" }),
    shared("commits", "Commits", "by agent", fmt.count, { scale: "integer" }),
    { title: "Lines of code", unit: "by agent and change", format: fmt.lines, parts: agents.filter(a => a.metric.lines).map(a => ({
      query: growth(a.metric.lines, "type", step), name: m => `${a.label} · ${m.type || "?"}`,
    })) },
  ];
  return list.filter(p => p.parts.length);
}
// LiteLLM rates are USD per token. Apply discounts to the inclusive input
// count; output already includes reasoning. No model-name guessing.
function costRows(rows, codex) {
  return rows.flatMap(r => {
    const type = r.metric.token_type;
    if (!["input", "cached_input", "cache_write_input", "output"].includes(type)) return [];
    const samples = r.values || [r.value];
    if (!samples.some(([, v]) => Number(v) > 0)) return [r];
    const model = (r.metric.model || "").replace(/^openai\//, "");
    const price = codex.prices?.[model];
    const input = price?.input_cost_per_token, output = price?.output_cost_per_token;
    const cached = price?.cache_read_input_token_cost, written = price?.cache_creation_input_token_cost;
    const valid = v => Number.isFinite(v) && v >= 0;
    if (!valid(input) || !valid(output) || (type === "cached_input" && !valid(cached)) ||
        (type === "cache_write_input" && !valid(written))) {
      codex.missing.add(model || "unknown model");
      return [];
    }
    const rate = type === "input" ? input : type === "output" ? output : type === "cached_input" ? cached - input : written - input;
    const convert = ([t, v]) => [t, Number(v) * rate];
    return [{ ...r, ...(r.values ? { values: samples.map(convert) } : { value: convert(r.value) }) }];
  }).filter(r => !codex.missing.has((r.metric.model || "unknown model").replace(/^openai\//, "")));
}
function costNote(codex) {
  if (codex.coverage) return codex.coverage;
  if (!codex.prices) return "Pricing unavailable; restart container to retry";
  if (codex.missing.size) return "Incomplete estimate; missing prices: " + [...codex.missing].sort().join(", ");
  return "API equivalent, not subscription billing; excludes tier and long-context adjustments. Prices refresh on container restart.";
}

async function load() {
  const version = ++loadVersion, now = Math.floor(Date.now() / 1000), end = now, start = end - range.seconds + range.step;
  const tiles = document.getElementById("tiles"), cards = document.getElementById("cards"), comparisonSection = document.getElementById("comparison");
  tiles.hidden = cards.hidden = comparison;
  comparisonSection.hidden = !comparison;
  document.getElementById("tool").disabled = comparison;
  document.getElementById("tool").value = comparison ? "all" : tool.id;
  cards.classList.add("loading"); comparisonSection.classList.add("loading");
  try {
    const codex = await codexMetrics();
    if ((comparison || shows("codex")) && codex.tokens) {
      const response = await fetch("/api/pricing");
      if (response.ok) codex.prices = await response.json();
      const rows = await instant(`group by (host_name,project) (last_over_time(${codex.tokens}{token_type="total"}[${LOOKBACK}]))`, now);
      codex.coverage = coverageNote(rows);
    }
    const agents = await Promise.all(AGENTS.filter(a => comparison || shows(a.id)).map(a => readAgent(a, codex, now)));
    if (version !== loadVersion) return;
    const coverage = document.getElementById("coverage"); coverage.textContent = codex.coverage; coverage.hidden = !codex.coverage;
    if (comparison) renderComparison(agents, now);
    else {
      const list = panels(agents, range.step), queries = new Map();
      const rangeRows = query => {
        if (!queries.has(query)) queries.set(query, series(query, start, end, range.step));
        return queries.get(query);
      };
      const charts = await Promise.all(list.map(async panel => {
        const results = await Promise.all(panel.parts.map(async part => {
          const rows = await rangeRows(part.query);
          return (part.transform ? part.transform(rows) : rows).map(r => ({ name: part.name(r.metric), values: r.values }));
        }));
        const data = fold(results.flat(), panel.grouped ? Infinity : SERIES.length);
        if (panel.grouped) {
          const index = name => AGENTS.findIndex(a => name === a.label || name === a.label + " (estimated)");
          data.sort((a, b) => index(a.name) - index(b.name));
          for (const item of data) item.color = `var(${SERIES[index(item.name) % SERIES.length]})`;
        }
        return { ...panel, series: data, note: panel.title.startsWith("Cost") && agents.some(a => a.metric.estimated) ? costNote(codex) : "" };
      }));
      const tokens = agents.filter(a => a.metric.tokens).map(a => tokenSelector(a.metric));
      const [daily, heat] = await Promise.all([dailyTokens(tokens, now), hourly(tokens, now)]);
      if (version !== loadVersion) return;
      const specs = [];
      for (const agent of agents) for (const id of ["cost", "total", "sessions", "cacheHit"]) {
        const spec = COMPARISON_ROWS.find(r => r.id === id);
        if (id === "cost" && !agent.metric.cost && !agent.metric.convertCost || id === "sessions" && !agent.metric.sessions) continue;
        const buckets = (id === "cacheHit" ? null : charts.find(c => c.title === (id === "cost" ? "Cost over time" : id === "total" ? "Tokens over time" : "Sessions")))?.series.find(s => s.name === agent.label || s.name === agent.label + " (estimated)")?.values || new Map();
        specs.push({ label: `${agent.label} ${id === "cost" && agent.metric.estimated ? "estimated cost" : spec.label.toLowerCase()}`, format: id === "total" ? fmt.tokens : spec.format,
          data: { now: agent.values[id] ?? null, before: null, buckets }, note: agent.values[id] == null ? agent.notes[id] : id === "cost" && agent.metric.estimated ? "Standard API estimate · LiteLLM" : "" });
      }
      renderTiles(specs, start, end);
      renderCharts(charts, start, end, [insightsCard(daily), heatCard(heat)]);
    }
    document.getElementById("error").hidden = true;
    document.getElementById("updated").textContent = "Updated " + new Date(now * 1000).toLocaleTimeString("en-GB");
  } catch (error) {
    if (version !== loadVersion) return;
    const box = document.getElementById("error"); box.textContent = "Cannot read data: " + error.message; box.hidden = false;
  } finally {
    if (version === loadVersion) { cards.classList.remove("loading"); comparisonSection.classList.remove("loading"); }
  }
}

// Same-name results are merged; past the palette, the smallest fold into "other".
function fold(list, limit = SERIES.length) {
  const byName = new Map();
  for (const s of list) {
    const values = byName.get(s.name) || new Map();
    for (const [t, v] of s.values) values.set(t, (values.get(t) || 0) + Number(v));
    byName.set(s.name, values);
  }
  let out = [...byName].map(([name, values]) => ({ name, values, sum: [...values.values()].reduce((a, b) => a + b, 0) }))
    .filter(s => s.sum > 0).sort((a, b) => b.sum - a.sum);
  if (out.length > limit) {
    const rest = out.slice(limit - 1), values = new Map();
    for (const s of rest) for (const [t, v] of s.values) values.set(t, (values.get(t) || 0) + v);
    out = [...out.slice(0, limit - 1), { name: "other", values, sum: rest.reduce((a, s) => a + s.sum, 0) }];
  }
  return out.map((s, i) => ({ ...s, color: `var(${SERIES[i]})` }));
}

function renderTiles(tiles, start, end) {
  const times = [];
  for (let t = start; t <= end; t += range.step) times.push(t);
  document.getElementById("tiles").replaceChildren(...tiles.map(t => {
    const tile = el("div", "tile"), row = el("div", "row");
    const { now, before, buckets } = t.data;
    row.append(el("div", "value", now == null ? "—" : t.format(now)));
    let delta = "";
    if (now != null && before != null) {
      if (t.ratio) delta = `${now >= before ? "▲" : "▼"} ${Math.abs((now - before) * 100).toFixed(1)} pp`;
      else if (before > 0) delta = `${now >= before ? "▲" : "▼"} ${Math.abs((now - before) / before * 100).toFixed(0)}%`;
      else if (now > 0) delta = "new";
    }
    if (delta) {
      const d = el("span", "delta", delta);
      d.title = "Compared with the previous " + range.label;
      row.append(d);
    }
    tile.append(el("div", "label", t.label), row);
    if (now != null && buckets.size) tile.append(spark(times.map(time => buckets.get(time) || 0)));
    if (t.note) {
      const note = el("div", "note", t.note);
      note.title = t.detail || t.note;
      tile.append(note);
    }
    return tile;
  }));
}
function spark(values) {
  const W = 160, H = 28, max = Math.max(...values, 0) || 1;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", "aria-hidden": "true" });
  const points = values.map((v, i) => `${(i / Math.max(1, values.length - 1)) * W},${H - 2 - (v / max) * (H - 4)}`).join(" ");
  svg.append(svgEl("polyline", { points, fill: "none", stroke: "var(--s1)", "stroke-width": 2, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round" }));
  return svg;
}

// Daily token totals for the window plus the week before it, for spike detection.
async function dailyTokens(selectors, now) {
  const day = 86400, end = Math.floor(now / day) * day + day, days = Math.max(7, Math.round(range.seconds / day));
  const totals = new Map();
  await Promise.all(selectors.map(async sel => {
    for (const r of await series(growth(sel, "", day), end - (days + 7) * day + day, end, day))
      for (const [t, v] of r.values) totals.set(t, (totals.get(t) || 0) + Number(v));
  }));
  const list = [];
  for (let t = end - (days + 7) * day + day; t <= end; t += day) list.push([t, totals.get(t) || 0]);
  return { list, days };
}
const SPIKE = 2.5;
function spikes(values, window) {
  return values.map((v, i) => {
    if (i < window) return null;
    const avg = values.slice(i - window, i).reduce((a, b) => a + b, 0) / window;
    return avg > 0 && v > SPIKE * avg ? v / avg : null;
  });
}
function insightsCard({ list, days }) {
  const card = el("article", "card"), head = el("div", "card-head");
  head.append(el("h2", "", "To check"), el("span", "unit", `token spikes over ${SPIKE}× the 7-day average`));
  card.append(head);
  const factors = spikes(list.map(([, v]) => v), 7);
  const items = list.map(([t, v], i) => ({ t, v, f: factors[i] })).slice(-days).filter(x => x.f).reverse().slice(0, 6);
  if (!items.length) {
    card.append(el("div", "empty", "No spikes in this range"));
    return card;
  }
  const ul = el("ul", "insights");
  for (const x of items) {
    const li = el("li");
    li.append(el("span", "when", new Date((x.t - 86400) * 1000).toLocaleDateString("en-GB", { day: "numeric", month: "short" })),
      el("span", "badge", "Spike"), el("span", "", `${fmt.tokens(x.v)} tokens, ${x.f.toFixed(1)}× the 7-day average`));
    ul.append(li);
  }
  card.append(ul);
  return card;
}

// Hourly token totals over at least a week, folded into weekday × hour.
async function hourly(selectors, now) {
  const hour = 3600, end = Math.floor(now / hour) * hour + hour, span = Math.max(range.seconds, 7 * 86400);
  const grid = Array.from({ length: 7 }, () => new Array(24).fill(0));
  await Promise.all(selectors.map(async sel => {
    for (const r of await series(growth(sel, "", hour), end - span + hour, end, hour))
      for (const [t, v] of r.values) {
        const d = new Date((t - hour) * 1000);
        grid[(d.getDay() + 6) % 7][d.getHours()] += Number(v);
      }
  }));
  return { grid, days: Math.round(span / 86400) };
}
const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const HEAT = [20, 40, 60, 80, 100].map(p => `color-mix(in oklab, var(--s1) ${p}%, var(--surface))`);
function heatCard({ grid, days }) {
  const card = el("article", "card"), head = el("div", "card-head");
  head.append(el("h2", "", "Activity by hour"), el("span", "unit", `tokens, last ${days} days`));
  card.append(head);
  const max = Math.max(...grid.flat());
  const box = el("div", "heat");
  grid.forEach((row, d) => {
    box.append(el("span", "", WEEKDAYS[d]));
    row.forEach((v, h) => {
      const cell = el("span", "cell");
      if (v > 0) cell.style.background = HEAT[Math.min(4, Math.floor((v / max) * 5))];
      cell.tabIndex = 0;
      const show = event => tooltip(event, `${WEEKDAYS[d]} ${String(h).padStart(2, "0")}:00`, [[{ name: "tokens", color: "var(--s1)" }, v]], fmt.tokens);
      cell.addEventListener("pointermove", show);
      cell.addEventListener("focus", show);
      for (const name of ["pointerleave", "blur"]) cell.addEventListener(name, hideTip);
      box.append(cell);
    });
  });
  box.append(el("span"));
  for (let h = 0; h < 24; h++) box.append(el("span", "", h % 6 === 0 ? String(h) : ""));
  const scale = el("div", "heat-scale");
  scale.append(document.createTextNode("Less"));
  for (const color of ["var(--grid)", ...HEAT]) { const i = el("i"); i.style.background = color; scale.append(i); }
  scale.append(document.createTextNode("More"));
  card.append(box, scale);
  return card;
}

function renderCharts(charts, start, end, extras) {
  const times = [];
  for (let t = start; t <= end; t += range.step) times.push(t);
  const cards = document.getElementById("cards");
  if (!charts.length) {
    cards.replaceChildren(el("div", "empty", "No usage metrics in Prometheus"));
    return;
  }
  const rendered = charts.map(chart => {
    const card = el("article", "card");
    const head = el("div", "card-head");
    const toggle = el("button", "toggle", tables.has(chart.title) ? "chart" : "table");
    toggle.onclick = () => { tables.has(chart.title) ? tables.delete(chart.title) : tables.add(chart.title); renderCharts(charts, start, end, extras); };
    head.append(el("h2", "", chart.title), el("span", "unit", chart.unit), toggle);
    card.append(head);
    if (chart.note) card.append(el("div", "note", chart.note));
    if (!chart.series.length) {
      card.append(el("div", "empty", "No data in this range"));
      return card;
    }
    const spiky = chart.spikes && range.step === 86400 && spikes(times.map(t => chart.series.reduce((a, s) => a + (s.values.get(t) || 0), 0)), 7);
    if (chart.series.length > 1 || chart.grouped || (spiky && spiky.some(Boolean))) {
      const legend = el("div", "legend");
      for (const s of chart.series) {
        const key = el("i"); key.style.background = s.color;
        const item = el("span"); item.append(key, document.createTextNode(s.name));
        legend.append(item);
      }
      if (spiky && spiky.some(Boolean)) {
        const item = el("span"); item.append(el("i", "spike-key"), document.createTextNode("spike day"));
        legend.append(item);
      }
      card.append(legend);
    }
    card.append(tables.has(chart.title) ? table(chart, times) : bars(chart, times, spiky || []));
    return card;
  });
  cards.replaceChildren(...rendered, ...extras);
}

function table(chart, times) {
  const wrap = el("div", "table-wrap"), t = el("table"), head = el("tr");
  head.append(el("th", "", "Time"), ...chart.series.map(s => el("th", "", s.name)));
  t.append(head);
  for (const time of [...times].reverse()) {
    const row = el("tr");
    row.append(el("td", "", label(time, true)), ...chart.series.map(s => el("td", "", chart.format(s.values.get(time) || 0))));
    t.append(row);
  }
  wrap.append(t);
  return wrap;
}

const NS = "http://www.w3.org/2000/svg";
function bars(chart, times, spiky) {
  const W = 640, H = 220, left = 52, right = 8, top = 8, bottom = 24;
  const totals = times.map(t => chart.series.reduce((a, s) => a + (s.values.get(t) || 0), 0));
  const max = scaleMax(chart.grouped ? Math.max(0, ...chart.series.flatMap(s => [...s.values.values()])) : Math.max(...totals, 0), chart.scale);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": chart.title });
  const y = v => top + (H - top - bottom) * (1 - v / max);
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4;
    svg.append(svgEl("line", { x1: left, x2: W - right, y1: y(v), y2: y(v), stroke: i ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }));
    const tick = svgEl("text", { x: left - 6, y: y(v) + 4, "text-anchor": "end" }); tick.textContent = chart.format(v);
    svg.append(tick);
  }
  const band = (W - left - right) / times.length, groups = chart.grouped ? Math.max(1, chart.series.length) : 1, width = Math.max(1, Math.min(28, (band - 2) / groups));
  const every = Math.ceil(times.length / 8);
  spiky.forEach((f, i) => {
    if (f) svg.append(svgEl("rect", { x: left + band * i, y: top, width: band, height: H - top - bottom, fill: "var(--spike)" }));
  });
  times.forEach((time, i) => {
    const x = left + band * i + (band - width) / 2;
    let base = 0;
    const stack = chart.series.map((s, index) => ({ s, index, v: s.values.get(time) || 0 })).filter(p => p.v > 0);
    stack.forEach((p, k) => {
      const y0 = y(chart.grouped ? 0 : base), y1 = y((chart.grouped ? 0 : base) + p.v), last = chart.grouped || k === stack.length - 1;
      const barX = chart.grouped ? left + band * i + (band - width * groups) / 2 + p.index * width : x;
      const h = Math.max(0, y0 - y1 - (last ? 0 : 2));
      const top1 = y0 - h, r = last ? Math.min(4, width / 2, h) : 0;
      svg.append(svgEl("path", { fill: p.s.color, d:
        `M${barX},${y0}V${top1 + r}${r ? `Q${barX},${top1} ${barX + r},${top1}` : ""}H${barX + width - r}${r ? `Q${barX + width},${top1} ${barX + width},${top1 + r}` : ""}V${y0}Z` }));
      base += p.v;
    });
    if (i % every === 0) {
      const t = svgEl("text", { x: x + width / 2, y: H - 6, "text-anchor": "middle" }); t.textContent = label(time, false);
      svg.append(t);
    }
    const hit = svgEl("rect", { x: left + band * i, y: top, width: band, height: H - top - bottom, fill: "transparent", tabindex: 0 });
    const show = event => {
      hit.setAttribute("fill", "var(--wash)");
      tooltip(event, label(time, true), chart.series.map(s => [s, s.values.get(time) || 0]), chart.format);
    };
    hit.addEventListener("pointermove", show);
    hit.addEventListener("focus", show);
    for (const name of ["pointerleave", "blur"]) hit.addEventListener(name, () => { hit.setAttribute("fill", "transparent"); hideTip(); });
    svg.append(hit);
  });
  return svg;
}

function tooltip(event, when, rows, format) {
  const tip = document.getElementById("tip");
  tip.replaceChildren(el("div", "when", when), ...rows.map(([s, v]) => {
    const row = el("div", "row"), key = el("span", "key");
    key.style.background = s.color;
    row.append(key, document.createTextNode(s.name), el("b", "", format(v)));
    return row;
  }));
  tip.hidden = false;
  const box = event.clientX !== undefined ? { x: event.clientX, y: event.clientY } : (() => { const r = event.target.getBoundingClientRect(); return { x: r.right, y: r.top }; })();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(box.x + 14, innerWidth - w - 8) + "px";
  tip.style.top = Math.max(8, Math.min(box.y - h - 10, innerHeight - h - 8)) + "px";
}
const hideTip = () => { document.getElementById("tip").hidden = true; };

// The bucket ending at `time` started one step earlier.
function label(time, long) {
  const d = new Date((time - range.step) * 1000);
  if (range.step < 86400) {
    const hm = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    return long || range.step > 3600 || d.getHours() === 0 ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + hm : hm;
  }
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}
// Ticks at quarters of the maximum: whole numbers for counts, round minutes or hours for time.
function scaleMax(v, scale) {
  if (scale === "integer") return Math.max(4, Math.ceil(nice(v) / 4) * 4);
  if (scale === "time") return v >= 7200 ? nice(v / 3600) * 3600 : Math.max(4, Math.ceil(nice(v / 60) / 4) * 4) * 60;
  return nice(v);
}
function nice(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v)), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 4 : n <= 5 ? 5 : 10) * p;
}
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function svgEl(tag, attrs) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

// Every header list: its choice is remembered under its id.
function selector(id, options, current, choose) {
  const select = document.getElementById(id);
  select.replaceChildren(...options.map(([value, text]) => {
    const option = el("option", "", text);
    option.value = value;
    option.selected = value === current;
    return option;
  }));
  select.onchange = () => {
    choose(select.value);
    try { localStorage.setItem(id, select.value); } catch (_) {}
    load();
  };
}
// The servers and projects that reported agent metrics within the lookback.
async function scopes() {
  await Promise.all(SCOPES.map(async s => {
    const rows = await instant(`group by (${s.label}) (last_over_time({__name__=~"(${AGENTS.map(a => a.prefix).join("|")})_.+"}[${LOOKBACK}]))`,
      Math.floor(Date.now() / 1000));
    const values = [...new Set(rows.map(r => r.metric[s.label]).filter(Boolean))].sort();
    if (scope[s.id] !== ANY && !values.includes(scope[s.id])) values.push(scope[s.id]);
    selector(s.id, [[ANY, s.all], ...values.map(value => [value, value])], scope[s.id], value => { scope[s.id] = value; });
  }));
}
selector("tool", TOOLS.map(t => [t.id, t.label]), tool.id, id => { tool = TOOLS.find(t => t.id === id); });
selector("range", RANGES.map(r => [r.id, r.label]), range.id, id => { range = RANGES.find(r => r.id === id); });
const compareSwitch = document.getElementById("compare");
compareSwitch.checked = comparison;
compareSwitch.onchange = () => {
  comparison = compareSwitch.checked;
  try { localStorage.setItem("comparison", String(comparison)); } catch (_) {}
  load();
};
// Light or dark; the system preference until the switch is used.
const switcher = document.getElementById("theme");
function theme(value) {
  document.documentElement.dataset.theme = value;
  switcher.textContent = value === "dark" ? "☀ Light" : "☾ Dark";
  switcher.setAttribute("aria-label", `Switch to ${value === "dark" ? "light" : "dark"} theme`);
}
let current = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { current = ["light", "dark"].find(v => v === localStorage.getItem("theme")) || current; } catch (_) {}
theme(current);
switcher.onclick = () => {
  current = current === "dark" ? "light" : "dark";
  theme(current);
  try { localStorage.setItem("theme", current); } catch (_) {}
};
scopes().catch(() => {});
load();
setInterval(load, 60000);
