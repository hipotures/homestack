<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI usage</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/aiusage-tokens.css"><style>
* { box-sizing: border-box; }
main { max-width: 1320px; margin: 0 auto; padding: 28px 16px 64px; display: flex; flex-direction: column; gap: var(--gap-section); }
[hidden] { display: none !important; }
h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.brand, .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-width: 0; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-small); color: var(--muted); }
.live.stale .live-dot { background: var(--warn); box-shadow: none; }
.scope { font: inherit; font-size: 13px; color: var(--text-2); background: transparent; border: 1px solid var(--border-strong); border-radius: var(--radius-ctl); min-height: 40px; padding: 0 10px; max-width: 200px; }
.scope option { background: var(--surface-3); color: var(--text); }
.theme { cursor: pointer; }
.range { position: relative; max-width: 100%; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; width: 220px; padding: 6px; background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 2px; }
.menu button { border: 0; text-align: left; min-height: 38px; padding: 0 12px; border-radius: 8px; background: transparent; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.menu button:hover:not(:disabled), .menu button.active { background: var(--surface-2); }
.menu button:disabled { color: var(--faint); cursor: not-allowed; }
.menu .hint { font-size: 11px; color: var(--faint); }
.error { border: 1px solid var(--up); border-radius: var(--radius-ctl); padding: 8px 12px; }
.error::before { content: "⚠ "; color: var(--up); }
a { color: var(--tok-uncached); }
.link { font: inherit; color: var(--tok-uncached); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.row-2, .kpi-grid { min-width: 0; }
.row-2:not(:has(> :not([hidden]))), .row-3:not(:has(> :not([hidden]))) { display: none; }
.row-3 { display: flex; flex-wrap: wrap; gap: var(--gap-grid); }
.row-3 > .heat-card { flex: 999 1 640px; }
.row-3 > .side { flex: 1 1 320px; }
.card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.card-top > div:first-child { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; min-width: 0; }
.card .seg { background: var(--bg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--fs-small); color: var(--text-2); }
.legend span, .swatch-label { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); font-size: var(--fs-small); }
.kpi { gap: 12px; }
.kpi .figure, .metric .figure { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.kpi .legend-row, .bar-row .head { display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-small); color: var(--muted); }
.kpi .stack { display: flex; flex-direction: column; gap: 6px; }
.spark { width: 100%; height: 36px; display: block; }
.hits { display: flex; gap: 2px; align-items: flex-end; height: 24px; }
.hits span { flex: 1; border-radius: 1px; min-width: 1px; }
.note { color: var(--muted); font-size: var(--fs-small); }
.faint { color: var(--faint); }
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar-row { display: flex; flex-direction: column; gap: 6px; }
.bar-row .head { font-size: 13px; color: var(--text-2); }
.bar-row .head .num { color: var(--text); }
.track { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; display: flex; }
.track > span { display: block; height: 100%; }
.track.thick { height: 10px; border-radius: 5px; }
.model { display: flex; flex-direction: column; gap: 8px; }
.model .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.model .name { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.model .cost { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
.model .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-small); color: var(--muted); }
.idle { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.idle.first { padding-top: 14px; border-top: 1px solid var(--border); }
.idle .sw { opacity: .45; }
.heat-legend { display: flex; align-items: center; gap: 6px; font-size: var(--fs-tick); color: var(--faint); }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; }
.chart.heat { height: 250px; }
.spikes { display: flex; flex-direction: column; gap: 10px; }
.spike { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.spike.top { background: var(--alert-bg); }
.spike .factor { font-family: var(--font-mono); font-size: 15px; font-weight: 600; min-width: 64px; color: var(--warn); }
.spike.top .factor { color: var(--claude-hi); }
.spike div { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.spike div .num { font-size: var(--fs-small); color: var(--muted); }
.agents-now { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--border); }
.agents-now div { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: var(--fs-small); color: var(--faint); }
.raw { display: flex; flex-direction: column; gap: var(--gap-grid); }
.raw-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.raw-head h2 { margin: 0; font-size: var(--fs-h2); }
.agents { display: flex; flex-direction: column; gap: var(--gap-grid); }
.compare-rows { display: flex; flex-direction: column; }
.compare-row { display: grid; grid-template-columns: minmax(110px, 180px) repeat(var(--agents, 2), minmax(0, 1fr)); gap: 20px; align-items: center; padding: 11px 0; border-top: 1px solid var(--border); font-size: 13px; }
.compare-row > span:first-child { color: var(--text-2); }
.compare-row .cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
.compare-row .cell .track { flex: 1; height: 6px; }
.compare-row .cell .num { min-width: 84px; text-align: right; }
.compare-row .cell .num.missing { color: var(--faint); font-family: var(--font-sans); }
.agent-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.tabs { display: inline-flex; gap: 4px; border-bottom: 1px solid var(--border-strong); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; min-height: 44px; padding: 0 16px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--tab-color); }
.tabs .count { font-size: 11px; color: var(--faint); font-weight: 400; }
.agent-title { margin: 0; font-size: 18px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
.agent-title i, .tabs i { width: 8px; height: 8px; border-radius: 50%; }
.mini { display: flex; align-items: flex-end; gap: 2px; height: 40px; }
.mini span { flex: 1; border-radius: 2px 2px 0 0; min-width: 1px; }
.mini-axis { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
.metric .kpi-value { font-size: 34px; }
.kpi-grid.metrics { grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.metric .figure .note { white-space: nowrap; }
.work { display: grid; grid-template-columns: minmax(56px, auto) minmax(0, 1fr) 84px; gap: 12px; align-items: center; font-size: 13px; }
.work .track { height: 14px; border-radius: 4px; }
.work > span:first-child { color: var(--text-2); }
.work > span:last-child, .tool > span:last-child { text-align: right; }
.tool { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr) 60px; gap: 12px; align-items: center; font-size: 12px; }
.tool > span:first-child { font-family: var(--font-mono); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .track { height: 10px; border-radius: 3px; }
.badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 12%, transparent); font-size: var(--fs-small); color: var(--warn); }
.empty { padding: 28px; gap: 22px; }
.empty h3 { margin: 0; font-size: 16px; }
.empty p { margin: 0; font-size: 13px; color: var(--text-2); }
.placeholders { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.placeholders div { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-small); color: var(--faint); }
.placeholders .num { font-size: 22px; color: var(--faint); }
.agents h3 { margin: 0; font-size: var(--fs-h2); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: var(--gap-grid); }
.cards .card { gap: 10px; }
.card-head { display: flex; align-items: baseline; gap: 8px; }
.card .unit { color: var(--muted); font-size: 12px; }
.card .toggle { font: inherit; font-size: 12px; color: var(--text-2); background: none; border: none; cursor: pointer; text-decoration: underline; }
.card-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.copy { font: inherit; font-size: 12px; color: var(--text-2); background: none; border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px 6px; cursor: pointer; }
.card .note { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.table-wrap { overflow-x: auto; max-height: 260px; overflow-y: auto; }
table { border-collapse: collapse; font-size: 12px; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--codex); outline-offset: 2px; }
</style>
<script defer src="/assets/echarts-6.1.0.min.js"></script>
<script defer src="/assets/aiusage-echarts-theme.js"></script>
<script defer src="/assets/dashboard.js"></script>
<script type="module" src="/assets/datastar-1.0.4.js"></script>
</head><body>
<main data-signals="window.usage.initial()"
 data-init="window.usage.restore(el)"
 data-effect="@get('/api/dashboard/events', {payload:{agent:$agent,host:$host,project:$project,range:$range,epoch:window.usage.select({agent:$agent,host:$host,project:$project,range:$range},$_sync)},retry:'always',retryMaxCount:1000,retryInterval:3000})">
<header class="top">
<div class="brand"><h1>AI usage</h1><span class="live" id="updated" aria-live="polite"><span class="live-dot" aria-hidden="true"></span><span id="updated-text">connecting…</span></span></div>
<div class="controls">
<div class="range" data-on:click__outside="$_more=false" data-on:keydown__window="evt.key==='Escape'&&($_more=false)">
<div class="seg scroll" role="group" aria-label="Time range">
<button type="button" data-on:click="$range='1h'" data-attr:aria-pressed="String($range==='1h')">1h</button>
<button type="button" data-on:click="$range='24h'" data-attr:aria-pressed="String($range==='24h')">24h</button>
<button type="button" data-on:click="$range='7d'" data-attr:aria-pressed="String($range==='7d')">7d</button>
<button type="button" data-on:click="$range='30d'" data-attr:aria-pressed="String($range==='30d')">30d</button>
<button type="button" id="range-90d" data-on:click="$range='90d'" data-attr:aria-pressed="String($range==='90d')">90d</button>
<button type="button" id="range-more" aria-haspopup="menu" data-on:click="$_more=!$_more" data-attr:aria-expanded="String($_more)" data-attr:aria-pressed="String(['180d','1y','all'].includes($range))" data-text="({'180d':'180 days','1y':'1 year','all':'All'}[$range]||'More')+' ▾'">More ▾</button>
</div>
<div class="menu" role="menu" data-show="$_more" style="display:none">
<button type="button" role="menuitem" data-on:click="$range='180d';$_more=false" data-class:active="$range==='180d'">180 days</button>
<button type="button" role="menuitem" data-on:click="$range='1y';$_more=false" data-class:active="$range==='1y'">1 year</button>
<button type="button" role="menuitem" data-on:click="$range='all';$_more=false" data-class:active="$range==='all'">All <span class="hint">retained history</span></button>
<button type="button" role="menuitem" disabled title="Custom ranges are not available yet">Custom range…</button>
</div>
</div>
<select class="scope" id="agent" aria-label="Agent" data-bind:agent><option value="all">Agents: all</option><option value="claude">Claude Code</option><option value="codex">Codex</option></select>
<select class="scope" id="host" aria-label="Server" data-bind:host><option value="*">Servers: all</option></select>
<select class="scope" id="project" aria-label="Project" data-bind:project><option value="*">Projects: all</option></select>
<button class="scope theme" id="theme" type="button">Theme</button>
</div></header>
<div hidden data-effect="if($_packet) window.usage.apply(JSON.parse($_packet))"></div>
<button id="resync" type="button" hidden data-on:click="$_sync++">Resynchronize</button>
<div class="error" id="error" role="status" hidden></div>
<div class="overview" id="overview" data-ignore-morph style="display:contents">
<section class="kpi-grid" id="kpis" aria-label="Summary"></section>
<section class="card" id="trend" aria-label="Usage over time">
<div class="card-top"><div><h2 id="trend-title">Cost over time</h2><span class="sub" id="trend-sub"></span></div>
<div class="card-tools"><div class="legend" id="trend-legend"></div>
<div class="seg" role="group" aria-label="Metric"><button type="button" data-metric="cost">Cost</button><button type="button" data-metric="tokens">Tokens</button></div></div></div>
<div class="chips" id="trend-chips"></div>
<div class="chart tall" id="trend-chart" role="img" aria-label="Usage over time, stacked by model"></div>
</section>
<div class="row-2"><section class="card" id="composition" aria-label="Token composition"></section><section class="card" id="models" aria-label="Cost by model"></section></div>
<div class="row-3">
<section class="card heat-card" aria-label="Activity by weekday and hour">
<div class="card-top"><div><h2>When you work</h2><span class="sub" id="heat-sub">tokens by weekday and hour · local time</span></div>
<div class="heat-legend" aria-hidden="true">less <i style="background:var(--heat-empty)"></i><i style="background:color-mix(in srgb,var(--codex) 30%,var(--heat-empty))"></i><i style="background:color-mix(in srgb,var(--codex) 65%,var(--heat-empty))"></i><i style="background:var(--codex)"></i> more</div></div>
<div class="chart heat" id="heat-chart" role="img" aria-label="Tokens by local weekday and hour"></div>
</section>
<section class="card side" id="spikes" aria-label="Usage spikes"></section>
</div>
<section class="agents" id="agents" aria-label="Agent details"></section>
</div>
<footer class="foot"><span>AI Usage __HOMESTACK_USAGE_VERSION__ · Datastar 1.0.4 · Apache ECharts 6.1.0</span><span><a href="/assets/datastar-LICENSE.md">Datastar license</a> · <a href="/assets/echarts-LICENSE.txt">ECharts license</a> · <a href="/assets/echarts-NOTICE.txt">Notices</a> · <button class="link" id="raw-toggle" type="button" aria-controls="raw" aria-expanded="false">Show raw charts</button></span></footer>
<section class="raw" id="raw" aria-label="Raw charts" hidden data-ignore-morph>
<div class="raw-head"><h2>Raw charts</h2><button class="scope copy-all" id="copy-all" type="button" title="Copy all chart data as JSON Lines">⧉ Copy all</button></div>
<div class="cards" id="cards" data-ignore></div>
</section>
</main></body></html>
