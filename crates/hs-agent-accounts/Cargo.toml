[package]
name = "hs-agent-accounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "homestack-agent-accounts"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
hs-service-status = { path = "../hs-service-status" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["process", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.28.0", features = ["v4"] }
