# The cluster of crates/hs-core/tests/migrate.rs and
# crates/hs-server/tests/migrate.rs: three nodes, the pools and tokens of
# deploy/pve/homestack-pve.sh install, and workspaces on pve-example-1.
#
# 200  Running, root and home on local-lvm, the Cloud-Init drive.
# 201  Stopped.
# 202  Running, with an unused0 reference.
# 203  Running, a 2T home: local-lvm on pve-example-2 has 1T free, so the
#      migration task fails there.
# 160  Alien workspace in the pool.
# 150  A workspace outside the pool.
#
# pve-example-2 has local-lvm and fast (layout 2); pve-example-3 is offline.
[pve]
version = { release = "9.2", version = "9.2.21", repoid = "4f6e0ac86f9e8c7f" }

[[pve.nodes]]
name = "pve-example-1"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 1
storages = [
  { storage = "local-lvm", total = 10000000000000, used = 0, avail = 10000000000000 },
  { storage = "local", total = 100000000000, used = 0, avail = 100000000000 },
]

[[pve.nodes]]
name = "pve-example-2"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 1
storages = [
  { storage = "local-lvm", total = 1099511627776, used = 0, avail = 1099511627776 },
  { storage = "fast", total = 1099511627776, used = 0, avail = 1099511627776 },
  { storage = "local", total = 100000000000, used = 0, avail = 100000000000 },
]

[[pve.nodes]]
name = "pve-example-3"
status = "offline"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 1
storages = [
  { storage = "local-lvm", total = 1099511627776, used = 0, avail = 1099511627776 },
]

[[pve.storages]]
storage = "local-lvm"
type = "lvmthin"
content = "images,rootdir"

[[pve.storages]]
storage = "fast"
type = "lvmthin"
content = "images"
nodes = "pve-example-2"

[[pve.storages]]
storage = "local"
type = "dir"
content = "iso,vztmpl,backup,snippets"

[[pve.vms]]
vmid = 101
node = "pve-example-1"
status = "running"
[pve.vms.config]
name = "gold"
tags = "homestack-gold"
scsi0 = "local-lvm:vm-101-disk-0,iothread=1,size=16G"
[pve.vms.guest]
hostname = "gold"
users = ["root", "developer"]

# --- 200 ---------------------------------------------------------------------

[[pve.volumes]]
node = "pve-example-1"
storage = "local-lvm"
volid = "local-lvm:vm-200-cloudinit"
size = 4194304

[[pve.volumes]]
node = "pve-example-1"
storage = "local-lvm"
volid = "local-lvm:vm-200-disk-0"
size = 17179869184

[[pve.volumes]]
node = "pve-example-1"
storage = "local-lvm"
volid = "local-lvm:vm-200-hs-home-developer"
size = 21474836480
label = "HS_HOME_200"

[[pve.vms]]
vmid = 200
node = "pve-example-1"
status = "running"
[pve.vms.config]
name = "alpha"
tags = "homestack-ws"
boot = "order=scsi0;ide2;net0"
ide2 = "local-lvm:vm-200-cloudinit,media=cdrom"
scsi0 = "local-lvm:vm-200-disk-0,iothread=1,size=16G"
scsi1 = "local-lvm:vm-200-hs-home-developer,serial=HS_HOME_200,size=20G"
net0 = "virtio=BC:24:11:00:02:00,bridge=vmbr0"
ipconfig0 = "ip=192.0.2.200/24,gw=192.0.2.1"
cicustom = "vendor=local:snippets/homestack-vendor-keep.yaml"
[pve.vms.guest]
hostname = "alpha"
users = ["root", "developer"]
filesystems = [
  { mountpoint = "/", type = "ext4", device = "sda1", slot = "scsi0", size = 17063460352, used = 4000000000, avail = 12000000000 },
  { mountpoint = "/home/developer", type = "ext4", device = "sdb", slot = "scsi1", label = "HS_HOME_200", size = 21474836480, used = 1000000000, avail = 20000000000 },
]

# --- 201 ---------------------------------------------------------------------

[[pve.volumes]]
node = "pve-example-1"
storage = "local-lvm"
volid = "local-lvm:vm-201-disk-0"
size = 17179869184

[[pve.volumes]]
node = "pve-example-1"
storage = "local-lvm"
volid = "local-lvm:vm-201-hs-home-developer"
size = 21474836480
label = "HS_HOME_201"

[[pve.vms]]
vmid = 201
node = "pve-example-1"
status = "stopped"
[pve.vms.config]
name = "beta"
tags = "homestack-ws"
scsi0 = "local-lvm:vm-201-disk-0,iothread=1,size=16G"
scsi1 = "local-lvm:vm-201-hs-home-developer,serial=HS_HOME_201,size=20G"
net0 = "virtio=BC:24:11:00:02:01,bridge=vmbr0"
cicustom = "vendor=local:snippets/homestack-vendor-keep.yaml"
[pve.vms.guest]
hostname = "beta"
users = ["root", "developer"]
filesystems = [
  { mountpoint = "/home/developer", type = "ext4", device = "sdb", slot = "scsi1", label = "HS_HOME_201", size = 21474836480, used = 1000000000, avail = 20000000000 },
]

# --- 202 ---------------------------------------------------------------------

[[pve.vms]]
vmid = 202
node = "pve-example-1"
status = "running"
[pve.vms.config]
name = "gamma"
tags = "homestack-ws"
scsi0 = "local-lvm:vm-202-disk-0,size=16G"
scsi1 = "local-lvm:vm-202-hs-home-developer,serial=HS_HOME_202,size=20G"
unused0 = "local-lvm:vm-202-disk-1"
[pve.vms.guest]
hostname = "gamma"
users = ["root", "developer"]

# --- 203 ---------------------------------------------------------------------

[[pve.volumes]]
node = "pve-example-1"
storage = "local-lvm"
volid = "local-lvm:vm-203-disk-0"
size = 17179869184

[[pve.volumes]]
node = "pve-example-1"
storage = "local-lvm"
volid = "local-lvm:vm-203-hs-home-developer"
size = 2199023255552
label = "HS_HOME_203"

[[pve.vms]]
vmid = 203
node = "pve-example-1"
status = "running"
[pve.vms.config]
name = "delta"
tags = "homestack-ws"
scsi0 = "local-lvm:vm-203-disk-0,size=16G"
scsi1 = "local-lvm:vm-203-hs-home-developer,serial=HS_HOME_203,size=2T"
[pve.vms.guest]
hostname = "delta"
users = ["root", "developer"]
filesystems = [
  { mountpoint = "/home/developer", type = "ext4", device = "sdb", slot = "scsi1", label = "HS_HOME_203", size = 2199023255552, used = 1000000000, avail = 2000000000000 },
]

# --- outside the workspaces -------------------------------------------------

[[pve.vms]]
vmid = 160
node = "pve-example-1"
status = "running"
[pve.vms.config]
name = "alien-workspace"
tags = "homestack-alien"
scsi0 = "local-lvm:vm-160-disk-0,size=16G"
scsi1 = "local-lvm:vm-160-hs-home-developer,serial=HS_HOME_160,size=20G"

[[pve.vms]]
vmid = 150
node = "pve-example-1"
status = "running"
[pve.vms.config]
name = "old-ws"
tags = "homestack-ws"
scsi0 = "local-lvm:vm-150-disk-0,size=16G"
scsi1 = "local-lvm:vm-150-hs-home-developer,serial=HS_HOME_150,size=20G"

[[pve.pools]]
poolid = "homestack"
vms = [160, 200, 201, 202, 203]

[[pve.pools]]
poolid = "homestack-gold"
vms = [101]

[[pve.tokens]]
id = "root@pam!sim"
secret = "00000000-0000-0000-0000-00000000000a"
acl = { "/" = ["*"] }

[[pve.tokens]]
id = "homestack@pve!server"
secret = "00000000-0000-0000-0000-00000000000b"
[pve.tokens.acl]
"/nodes" = ["Sys.Audit"]
"/storage" = ["Datastore.Audit"]
"/pool/homestack" = ["Pool.Audit", "VM.Allocate", "VM.Audit", "VM.Config.Cloudinit", "VM.Config.Disk", "VM.Config.Options", "VM.GuestAgent.Audit", "VM.GuestAgent.FileRead", "VM.GuestAgent.Unrestricted", "VM.Migrate", "VM.PowerMgmt"]
"/pool/homestack-gold" = ["Pool.Audit", "VM.Audit", "VM.Clone", "VM.GuestAgent.Audit", "VM.GuestAgent.FileRead", "VM.GuestAgent.Unrestricted"]
"/storage/local-lvm" = ["Datastore.AllocateSpace", "Datastore.Audit"]
"/storage/fast" = ["Datastore.AllocateSpace", "Datastore.Audit"]
"/storage/local" = ["Datastore.AllocateSpace", "Datastore.Audit"]
