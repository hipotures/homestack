# The cluster of crates/hs-core/tests/create_transfer.rs: the lifecycle
# cluster's Gold, pools and token, on five nodes.
#
# pve-example-1  Gold's node, local-lvm (layout 1).
# pve-example-2  fast (layout 2), local, vmbr0: the target.
# pve-example-3  offline.
# pve-example-4  local-lvm, local, only vmbr1: Gold's bridge is missing.
# pve-example-5  local-lvm disabled, vmbr0.
[pve]
version = { release = "9.2", version = "9.2.21", repoid = "4f6e0ac86f9e8c7f" }

[[pve.nodes]]
name = "pve-example-1"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 1
storages = [
  { storage = "local-lvm", total = 1000000000000, used = 0, avail = 1000000000000 },
  { storage = "local", total = 100000000000, used = 0, avail = 100000000000 },
]
network = [{ iface = "vmbr0", type = "bridge", active = 1 }]

[[pve.nodes]]
name = "pve-example-2"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 1
storages = [
  { storage = "fast", total = 1000000000000, used = 0, avail = 1000000000000 },
  { storage = "local", total = 100000000000, used = 0, avail = 100000000000 },
]
network = [
  { iface = "eno1", type = "eth", active = 1 },
  { iface = "vmbr0", type = "bridge", active = 1 },
]

[[pve.nodes]]
name = "pve-example-3"
status = "offline"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 0
storages = [
  { storage = "local-lvm", total = 1000000000000, used = 0, avail = 1000000000000 },
  { storage = "local", total = 100000000000, used = 0, avail = 100000000000 },
]
network = [{ iface = "vmbr0", type = "bridge", active = 1 }]

[[pve.nodes]]
name = "pve-example-4"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 1
storages = [
  { storage = "local-lvm", total = 1000000000000, used = 0, avail = 1000000000000 },
  { storage = "local", total = 100000000000, used = 0, avail = 100000000000 },
]
network = [{ iface = "vmbr1", type = "bridge", active = 1 }]

[[pve.nodes]]
name = "pve-example-5"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 1
storages = [
  { storage = "local-lvm", enabled = false, active = false },
  { storage = "local", total = 100000000000, used = 0, avail = 100000000000 },
]
network = [{ iface = "vmbr0", type = "bridge", active = 1 }]

[[pve.storages]]
storage = "local-lvm"
type = "lvmthin"
content = "images,rootdir"

[[pve.storages]]
storage = "fast"
type = "lvmthin"
content = "images"
nodes = "pve-example-2"

[[pve.storages]]
storage = "local"
type = "dir"
content = "iso,vztmpl,backup,snippets"

[[pve.volumes]]
node = "pve-example-1"
storage = "local-lvm"
volid = "local-lvm:vm-101-disk-0"
size = 17179869184
label = "gold-root"

[[pve.volumes]]
node = "pve-example-1"
storage = "local-lvm"
volid = "local-lvm:vm-101-cloudinit"
size = 4194304

[[pve.vms]]
vmid = 101
node = "pve-example-1"
status = "running"
[pve.vms.config]
name = "gold"
tags = "homestack-gold"
agent = "1"
boot = "order=scsi0;ide2;net0"
ide2 = "local-lvm:vm-101-cloudinit,media=cdrom"
net0 = "virtio=BC:24:11:00:01:01,bridge=vmbr0,firewall=1"
scsi0 = "local-lvm:vm-101-disk-0,iothread=1,size=16G"
sshkeys = "ssh-ed25519%20AAAAC3NzaC1lZDI1NTE5AAAAITEST%20developer%40desktop%0A"
cicustom = "user=local:snippets/gold-user.yaml"
[pve.vms.guest]
hostname = "gold"
users = ["root", "developer"]
filesystems = [{ mountpoint = "/", type = "ext4", device = "sda", slot = "scsi0", size = 17179869184, used = 4000000000, avail = 13000000000 }]
files = { "/root/.ssh/authorized_keys" = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIROOT root@gold\n" }

[[pve.pools]]
poolid = "homestack"

[[pve.pools]]
poolid = "homestack-gold"
vms = [101]

[[pve.tokens]]
id = "root@pam!sim"
secret = "00000000-0000-0000-0000-00000000000a"
acl = { "/" = ["*"] }

[[pve.tokens]]
id = "homestack@pve!server"
secret = "00000000-0000-0000-0000-00000000000b"
[pve.tokens.acl]
"/" = ["Sys.Audit", "VM.Audit", "Datastore.Audit", "VM.GuestAgent.Audit", "Pool.Audit", "SDN.Audit"]
"/pool/homestack" = ["Pool.Audit", "VM.Allocate", "VM.Audit", "VM.Config.Cloudinit", "VM.Config.Disk", "VM.Config.Options", "VM.GuestAgent.Audit", "VM.GuestAgent.FileRead", "VM.GuestAgent.Unrestricted", "VM.Migrate", "VM.PowerMgmt"]
"/pool/homestack-gold" = ["Pool.Audit", "VM.Audit", "VM.Clone", "VM.GuestAgent.Audit", "VM.GuestAgent.FileRead", "VM.GuestAgent.Unrestricted"]
"/storage/local-lvm" = ["Datastore.AllocateSpace", "Datastore.Audit"]
"/storage/fast" = ["Datastore.AllocateSpace", "Datastore.Audit"]
"/storage/local" = ["Datastore.AllocateSpace", "Datastore.Audit"]
"/sdn/zones/localnetwork/vmbr0" = ["SDN.Audit", "SDN.Use"]
