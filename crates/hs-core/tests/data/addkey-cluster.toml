# The cluster of crates/hs-core/tests/addkey.rs and
# crates/hs-server/tests/addkey.rs: one node, the pools and tokens of
# deploy/pve/homestack-pve.sh install, and workspaces whose sshkeys hold the
# YubiKey of python/tests/test_addkey.py.
#
# 200  Running, keep snippet; the home's authorized_keys has another key
#      and the YubiKey without a final newline.
# 201  Stopped, keep snippet.
# 202  Running, create snippet; the home has the user's own key too.
# 203  Running, Python's four per-VM snippets.
# 204  Running, keep snippet, no sshkeys.
# 205  Running, keep snippet, the agent does not answer.
# 206  Running, keep snippet, the image has no regular account.
# 207  Running, keep snippet, Cloud-Init's result lists an error.
# 208  Running, keep snippet, sshkeys hold the YubiKey and the Trezor key.
# 160  Alien workspace in the pool.
# 150  A workspace outside the pool.
[pve]
version = { release = "9.2", version = "9.2.21", repoid = "4f6e0ac86f9e8c7f" }

[[pve.nodes]]
name = "pve-example-1"
pveversion = "pve-manager/9.2.21/4f6e0ac86f9e8c7f"
kversion = "Linux 7.0.14-20-pve"
uptime = 1
storages = [
  { storage = "local-lvm", total = 10000000000000, used = 0, avail = 10000000000000 },
  { storage = "local", total = 100000000000, used = 0, avail = 100000000000 },
]

[[pve.storages]]
storage = "local-lvm"
type = "lvmthin"
content = "images,rootdir"

[[pve.storages]]
storage = "local"
type = "dir"
content = "iso,vztmpl,backup,snippets"

[[pve.vms]]
vmid = 101
node = "pve-example-1"
status = "running"
[pve.vms.config]
name = "gold"
tags = "homestack-gold"
scsi0 = "local-lvm:vm-101-disk-0,iothread=1,size=16G"
[pve.vms.guest]
hostname = "gold"
users = ["root", "developer"]

