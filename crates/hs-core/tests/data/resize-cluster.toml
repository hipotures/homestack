  { name = "/dev/sda1", type = "part", maj-min = "8:1", pkname = "/dev/sda", partition = 1, start = 2048, size = 17178803712, blkid = { UUID = "uuid-202" } },
  { name = "/dev/mapper/cryptroot", type = "crypt", maj-min = "253:0", pkname = "/dev/sda1", dm = "dm-0", dm_name = "cryptroot", size = 17162026496, luks_key = "correct horse battery staple" },
  { name = "/dev/mapper/vg-root", type = "lvm", maj-min = "253:1", pkname = "/dev/mapper/cryptroot", dm = "dm-1", dm_name = "vg-root", aliases = ["/dev/vg/root"], lv_path = "/dev/vg/root", vg = "vg", size = 17159946240, pv_size = 17160977920 },
