[package]
name = "hs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hs-model = { version = "0.1.0", path = "../hs-model" }
hs-pve = { version = "0.1.0", path = "../hs-pve" }
base64 = "0.23.1"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time"] }

[dev-dependencies]
hs-pve = { path = "../hs-pve" }
pve-sim = { path = "../pve-sim" }
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "test-util"] }
