[package]
name = "hs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
hs-model = { version = "0.1.0", path = "../hs-model" }
hs-pve = { version = "0.1.0", path = "../hs-pve" }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
hs-pve = { path = "../hs-pve" }
pve-sim = { path = "../pve-sim" }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "test-util"] }
