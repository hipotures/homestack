[package]
name = "hs-pve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hs-model = { version = "0.1.0", path = "../hs-model" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "form", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
pve-sim = { path = "../pve-sim" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
toml = "1.1.8"
