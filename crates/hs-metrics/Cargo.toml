[package]
name = "hs-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = "0.3.34"
hs-model = { path = "../hs-model" }
hs-service-status = { path = "../hs-service-status" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
rmcp = { version = "3.8.0", features = ["server", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
url = "2.5.8"

[[bin]]
name = "homestack-metrics"
path = "src/main.rs"
