schema: 3
service: agent-accounts
inputs:
  - id: interval_seconds
    label: Usage check interval
    description: Seconds between enabled profile usage checks.
    type: integer
    default: 240
    min: 60
    max: 3600
    target:
      type: environment
      variable: AGENT_ACCOUNTS_INTERVAL_SECONDS
  - id: probe_concurrency
    label: Concurrent probes
    description: Maximum simultaneous provider operations.
    type: integer
    default: 1
    min: 1
    max: 2
    target:
      type: environment
      variable: AGENT_ACCOUNTS_PROBE_CONCURRENCY
  - id: otlp_metrics_url
    label: Collector metrics URL
    description: Existing HomeStack Collector HTTP OTLP endpoint including /v1/metrics.
    type: url
    required: true
    allowed_schemes: [http, https]
    regex: '^https?://[^/?#]+/v1/metrics$'
    target:
      type: environment
      variable: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
  - id: telegram_enabled
    label: Telegram notifications
    description: Read from the local HomeStack telegram.toml configuration.
    type: boolean
    default: false
    target:
      type: environment
      variable: AGENT_ACCOUNTS_TELEGRAM_ENABLED
  - id: telegram_bot_token
    label: Telegram bot token
    description: Read from the local HomeStack telegram.toml configuration.
    type: secret
    target:
      type: environment
      variable: AGENT_ACCOUNTS_TELEGRAM_BOT_TOKEN
  - id: telegram_chat_id
    label: Telegram chat ID
    description: Read from the local HomeStack telegram.toml configuration.
    type: string
    target:
      type: environment
      variable: AGENT_ACCOUNTS_TELEGRAM_CHAT_ID
