schema: 3
id: homestack-api
name: HomeStack API
image:
  repository: ghcr.io/hipotures/homestack-server
runtime:
  telemetry: homestack
  ports:
    - name: https
      port: 443
      protocol: tcp
    - name: management
      port: 80
      protocol: tcp
  # Only health and telemetry are available over private management HTTP.
  healthcheck:
    type: http
    port: management
    path: /health/ready
    expected_status: 200
persistence:
# Used by clients inside the LAN only, never published through Pangolin.
exposure:
