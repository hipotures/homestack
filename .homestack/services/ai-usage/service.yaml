schema: 3
id: ai-usage
name: AI Usage
image:
  repository: ghcr.io/hipotures/homestack-ai-usage
runtime:
  ports:
    - name: http
      port: 80
      protocol: tcp
  healthcheck:
    type: http
    port: http
    path: /health/ready
    expected_status: 200
    heartbeat_seconds: 60
# Shared dashboard snapshots and query caches are bounded and memory-only.
persistence: {}
# Browsers force HTTPS for .app and other HSTS-preloaded domains; Pangolin
# terminates TLS and authenticates viewers.
exposure:
  pangolin:
    port: http
    name: AI Usage
    subdomain: ai-usage
