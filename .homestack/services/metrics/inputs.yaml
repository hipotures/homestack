schema: 3
service: metrics
inputs:
  - id: prometheus_url
    label: Prometheus URL
    description: HTTP base URL of Prometheus; path, query and fragment are ignored.
    type: url
    required: true
    allowed_schemes: [http]
    target:
      type: environment
      variable: HOMESTACK_PROMETHEUS_URL
  - id: access_key
    label: Access key
    description: Generated once and kept locally; MCP is served only at /mcp/<key>, so changing it breaks saved client URLs.
    type: key
    required: true
    target:
      type: environment
      variable: HOMESTACK_ACCESS_KEY
