schema: 3
service: otel
inputs:
  - id: prometheus_url
    label: Prometheus URL
    description: Base URL of the Prometheus server with its OTLP receiver enabled, without a path.
    type: url
    required: true
    allowed_schemes: [http, https]
    regex: '^[a-z]+://[^/?#]+$'
    target:
      type: environment
      variable: HOMESTACK_PROMETHEUS_URL
  - id: sending_queue_size
    label: Persistent export queue size
    description: Maximum export requests queued on the disposable root filesystem.
    type: integer
    required: true
    default: 1000
    min: 100
    max: 10000
    target:
      type: environment
      variable: HOMESTACK_SENDING_QUEUE_SIZE
