schema: 3
id: pangolin
name: Pangolin Site
image:
  repository: ghcr.io/hipotures/homestack-pangolin-site
runtime:
  telemetry: homestack
  ports:
    - name: http
      port: 8080
      protocol: tcp
  healthcheck:
    type: http
    port: http
    path: /health/ready
    expected_status: 200
    heartbeat_seconds: 60
persistence:
  mount: /home/app
  size: 10M
  directories:
    - pangolin-site
# The connector itself is the Pangolin tunnel; it exposes no resource.
exposure:
