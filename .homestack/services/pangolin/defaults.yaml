schema: 3
service: pangolin
# Running connectors use about 10–20 MiB of memory and under 40 MiB of root.
resources:
  cores: 1
  memory: 128M
  swap: 0M
  rootfs: 128M
deployment:
  hostname: pangolin
  # One connector per node; each has its own Site identity and local credential.
  instances: 3
  placement: spread
  state_model: local
