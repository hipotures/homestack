schema: 1
id: homestack-api
name: HomeStack API
image:
  repository: ghcr.io/hipotures/homestack-server
runtime:
  # Running instances use about 20 MiB of memory and under 100 MiB of root.
  resources:
    cores: 1
    memory: 256M
    swap: 0M
    rootfs: 256M
  ports:
    - name: https
      port: 443
      protocol: tcp
    - name: management
      port: 80
      protocol: tcp
  # Only health and telemetry are available over private management HTTP.
  healthcheck:
    type: http
    port: management
    path: /health/ready
    expected_status: 200
persistence:
deployment:
  hostname: hs-api
  # Independent API instances, one per node; clients switch between them.
  instances: 3
  placement: spread
  state_model: stateless
# Used by clients inside the LAN only, never published through Pangolin.
exposure:
