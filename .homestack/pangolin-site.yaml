schema: 1
id: pangolin
name: Pangolin Site
image:
  repository: ghcr.io/hipotures/homestack-pangolin-site
runtime:
  # Running connectors use about 10–20 MiB of memory and under 40 MiB of root.
  resources:
    cores: 1
    memory: 128M
    swap: 0M
    rootfs: 128M
  ports:
    - name: http
      port: 8080
      protocol: tcp
  healthcheck:
    type: http
    port: http
    path: /health/ready
    expected_status: 200
    heartbeat_seconds: 60
persistence:
  mount: /home/app
  size: 10M
  directories:
    - pangolin-site
deployment:
  hostname: pangolin
  # One connector per node; each has its own Site identity and local credential.
  instances: 3
  placement: spread
  state_model: local
# The connector itself is the Pangolin tunnel; it exposes no resource.
exposure:
