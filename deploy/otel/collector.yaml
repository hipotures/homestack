receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# Response usage is exported as delta gauges. Prometheus stores each pushed
# batch once; the dashboard sums samples instead of differencing counters.
connectors:
  sum/codex:
    logs:
      codex.response.tokens.total:
        source_attribute: tool_token_count
        conditions:
          - 'attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["tool_token_count"] != nil'
        attributes:
          - key: model
            default_value: unknown
          - key: model_reasoning_effort
            default_value: unknown
      codex.response.tokens.input:
        source_attribute: input_token_count
        conditions:
          - 'attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["input_token_count"] != nil'
        attributes:
          - key: model
            default_value: unknown
          - key: model_reasoning_effort
            default_value: unknown
      codex.response.tokens.cached_input:
        source_attribute: cached_token_count
        conditions:
          - 'attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cached_token_count"] != nil'
        attributes:
          - key: model
            default_value: unknown
          - key: model_reasoning_effort
            default_value: unknown
      codex.response.tokens.cache_write_input:
        source_attribute: cache_write_token_count
        conditions:
          - 'attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cache_write_token_count"] != nil'
        attributes:
          - key: model
            default_value: unknown
          - key: model_reasoning_effort
            default_value: unknown
      codex.response.tokens.output:
        source_attribute: output_token_count
        conditions:
          - 'attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["output_token_count"] != nil'
        attributes:
          - key: model
            default_value: unknown
          - key: model_reasoning_effort
            default_value: unknown
      codex.response.tokens.reasoning_output:
        source_attribute: reasoning_token_count
        conditions:
          - 'attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["reasoning_token_count"] != nil'
        attributes:
          - key: model
            default_value: unknown
          - key: model_reasoning_effort
            default_value: unknown
  # Claude Code api_request events become duration and time-to-first-token
  # sums with request counts, so the dashboard can show averages per bucket.
  sum/claude:
    logs:
      claude_code.api_request.duration_ms:
        source_attribute: duration_ms
        conditions:
          - 'attributes["event.name"] == "api_request" and attributes["duration_ms"] != nil'
        attributes: &claude-attributes
          - key: model
            default_value: unknown
          - key: effort
            default_value: unknown
      claude_code.api_request.count:
        source_attribute: homestack.one
        conditions:
          - 'attributes["event.name"] == "api_request" and attributes["duration_ms"] != nil'
        attributes: *claude-attributes
      claude_code.api_request.ttft_ms:
        source_attribute: ttft_ms
        conditions:
          - 'attributes["event.name"] == "api_request" and attributes["ttft_ms"] != nil'
        attributes: *claude-attributes
      claude_code.api_request.ttft_count:
        source_attribute: homestack.one
        conditions:
          - 'attributes["event.name"] == "api_request" and attributes["ttft_ms"] != nil'
        attributes: *claude-attributes

processors:
  # Compact identical resource/scope groups before summing a batch so they
  # cannot produce several samples for the same series at the same millisecond.
  groupbyattrs/codex: {}
  transform/codex:
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          # Isolate both token samples and Prometheus-generated target_info.
          - set(attributes["homestack.collector.instance"], Trim("${file:/etc/hostname}", " \t\r\n"))
      - context: datapoint
        statements:
          - set(attributes["collector_instance"], resource.attributes["homestack.collector.instance"])
          - set(attributes["token_type"], Substring(metric.name, Len("codex.response.tokens."), Len(metric.name) - Len("codex.response.tokens.")))
          # Same label as Claude Code's metrics; responses without an effort carry none.
          - set(attributes["effort"], attributes["model_reasoning_effort"]) where attributes["model_reasoning_effort"] != "unknown"
          - delete_key(attributes, "model_reasoning_effort")
      - context: metric
        statements:
          - convert_sum_to_gauge()
          - set(name, "codex.response.token_usage")
  transform/claude-logs:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          # The sum connector counts requests by summing this attribute.
          - set(attributes["homestack.one"], 1) where attributes["event.name"] == "api_request"
          # Claude Code stamps the session's Git repository on every record
          # (OTEL_METRICS_INCLUDE_REPOSITORY); one process serves one repository.
          - set(resource.attributes["project"], attributes["vcs.repository.name"]) where attributes["vcs.repository.name"] != nil
  # Native Claude Code metrics carry the repository on each datapoint. Move it
  # to the promoted project resource attribute and drop the other vcs labels.
  transform/claude-repository:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - set(resource.attributes["project"], attributes["vcs.repository.name"]) where attributes["vcs.repository.name"] != nil
          - delete_matching_keys(attributes, "^vcs\\.")
  transform/claude:
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          - set(attributes["homestack.collector.instance"], Trim("${file:/etc/hostname}", " \t\r\n"))
      - context: datapoint
        statements:
          - set(attributes["collector_instance"], resource.attributes["homestack.collector.instance"])
          - delete_key(attributes, "effort") where attributes["effort"] == "unknown"
      - context: metric
        statements:
          - convert_sum_to_gauge()
  batch:
    timeout: 5s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health/live
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: false

exporters:
  otlp_http:
    metrics_endpoint: ${env:HOMESTACK_PROMETHEUS_URL}/api/v1/otlp/v1/metrics
    sending_queue:
      enabled: true
      queue_size: ${env:HOMESTACK_SENDING_QUEUE_SIZE:-1000}
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions: [health_check, file_storage]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch, transform/claude-repository]
      exporters: [otlp_http]
    logs/codex:
      receivers: [otlp]
      processors: [batch, groupbyattrs/codex]
      exporters: [sum/codex]
    metrics/codex:
      receivers: [sum/codex]
      processors: [transform/codex]
      exporters: [otlp_http]
    logs/claude:
      receivers: [otlp]
      processors: [batch, groupbyattrs/codex, transform/claude-logs]
      exporters: [sum/claude]
    metrics/claude:
      receivers: [sum/claude]
      processors: [transform/claude]
      exporters: [otlp_http]
